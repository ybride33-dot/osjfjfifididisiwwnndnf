{k:['기억 저장','장기강화','hippocampus'],ti:'기억은 어떻게 저장되나',b:'해마가 새 기억을 잠시 보관, 수면과 반복을 거쳐 피질에 장기 저장 — 해마 손상(환자 H.M.)이 새 기억 형성만 파괴하는 걸로 실증됐죠. 세포 수준의 장치는 시냅스 강화(LTP) — "같이 발화하는 뉴런은 연결된다". 그리고 기억은 녹화물이 아니라 재구성 — 회상할 때마다 약간 다시 쓰이며(재고정화) 왜곡됩니다.',f:'그래서 확신 높은 기억이 틀릴 수 있습니다 — 목격담의 신뢰성 문제가 신경과학적으로 실측된 사례.'},
{k:['판구조론','대륙이동','지각판'],ti:'판구조론 — 떠다니는 대륙',b:'지표는 10여 개 거대 판으로 갈라져 연간 수 cm씩 이동 — 대서양이 넓어지고, 히말라야가 지금도 자라고 있습니다. 베게너가 1912년 제안했을 때 조롱받다가 1960년대 해저 자기 줄무늬가 결정적 증거로 완성된 이론. 지진·화산·산맥·섬호가 판 경계에 몰리는 단 하나의 지도로 설명됩니다.',f:'판의 엔진은 맨틀 대류 + 해령 밀기 + 판 끌림 — 마지막이 가장 강력한 구동력으로 현재 평가됩니다.'},
{k:['지진 조기경보','지진','p파 s파'],ti:'지진과 조기경보의 과학',b:'P파(빠르고 약함)가 먼저 오고 S파(느리고 강함)가 따라옵니다 — 그 시차가 조기경보의 물리적 여유. 전국 관측망이 P파를 잡는 즉시 위치·규모를 추정해 S파보다 먼저 알림을 뿌리죠. 예측(언제 어디)은 아직 불가능에 가깝지만, 즉시 경보·내진 설계로 사망률은 크게 줄일 수 있습니다 — 일본·한국 시스템이 실증 중.',f:'개인 대응 원칙: 낙하물 방어(머리 보호)→ 진동 멈추면 대피 — 달리기보다 10초 고정이 생명률을 올립니다.'},
{k:['해류','열염순환','gulf stream'],ti:'해류와 열염순환 — 지구의 심장',b:'바닷물은 온도·염분 차이로 만들어진 거대 컨베이어 벨트로 순환 — 북대서양에서 가라앉는 찬물이 천 년 걸려 돌아옵니다. 이 흐름이 유럽을 같은 위도 캐나다보다 따뜻하게 유지하죠. 빙하 녹물이 염분을 희석해 이 펌프를 약화시킬 수 있다는 게 기후 과학의 진지한 감시 항목입니다.',f:'해류는 지구 열의 90%를 흡수·재분배 — 해양이 기후 변동의 완충기입니다.'},
{k:['엘니뇨','라니냐','기후 변동'],ti:'엘니뇨·라니냐 — 태평양의 숨',b:'적도 태평양의 따뜻한 물이 동쪽으로 몰리면(엘니뇨) 전 세계 기상 패턴이 흔들립니다 — 한국 겨울 온난, 호주·동남아 가뭄, 페루 홍수. 반대로 냉수대가 강해지면(라니냐) 반대 경향. 2~7년 주기로 뒤집히며, 단기 기후 예보의 최대 자연 변수죠.',f:'엘니뇨 해엔 지구 평균 기온이 평년보다 크게 오릅니다 — 연간 기온 기록 갱신의 상당 부분이 이 스케일 효과.'},
{k:['빙하기','밀란코비치','간빙기'],ti:'빙하기의 주기 — 천체 역학이 짜는 기후',b:'지구 공전 궤도 이심률(10만 년), 자전축 기울기(4.1만 년), 세차운동(2.6만 년)의 합이 일조량 분포를 바꾸고, 피드백(빙반사·CO₂)이 증폭해 빙기·간빙기를 만듭니다 — 밀란코비치 주기. 현재는 간빙기이며, 자연 흐름만 보면 수천 년 뒤 완만한 냉각이 예정됐지만 — 인간 배출이 그 일정표를 통째로 덮어썼습니다.',f:'과거 대기 CO₂는 얼음 코어 기포에 그대로 갇혀 있어 80만 년 기후 기록이 실측 가능합니다.'},
{k:['자기장','극이동','오로라'],ti:'지구 자기장과 극 이동',b:'외핵 용융 철의 대류가 다이너모로 작동해 자기장을 만들고, 이 방패가 태양풍을 튕겨 대기를 지킵니다 — 오로라는 튕겨낸 입자가 대기와 부딪히는 빛. 자기 북극은 계속 이동 중(최근 가속)이고, 지질학적으로는 수십만 년마다 N·S가 뒤집힌 기록이 암석에 남아 있습니다. 뒤집힘 동안 방패가 약해지지만 대멸종 직결은 아닙니다.',f:'해저 확장대의 자기 줄무늬가 판구조론의 결정 증거 — 자기장 연구가 지질학을 바꿨습니다.'},
{k:['오존 구멍','오존층','몬트리올'],ti:'오존층 — 회복 성공한 위기',b:'냉매·스프레이 가스(CFC)가 성층권 오존을 파괴하며 남극 상공에 구멍이 생겼고, 1987년 몬트리올 의정서로 전 세계가 CFC를 퇴출 — 40년 만에 회복 궤도에 올랐습니다. 인류가 지구 규모 환경 위기를 국제 협약으로 되돌린 유일하고 완전한 성공 사례죠. 교훈: 과학 경고 → 글로벌 규제 → 대체 기술, 이 공식은 통합니다.',f:'기후 문제가 더 어려운 이유 — CFC 대체품은 있었지만, 화석연료 대체는 산업 전체를 바꿔야 하니까요.'},
{k:['4차원','사차원','시공간'],ti:'사차원과 시공간',b:'시간을 4번째 축으로 놓으면 우주 역사는 4차원 덩어리(블록 우주) — "지금"은 그 안을 읽는 위치일 뿐일 수 있습니다. 4차원 공간 자체를 상상하는 트릭: 3D→2D 투영을 거꾸로 응용해, 4차원 물체(테서랙트)의 3차원 그림자를 돌려보는 것. 수학은 간단합니다 — 좌표 4개, 거리 공식에 항 하나 추가.',f:'일반상대성에서 중력은 4차원 시공간의 휘어짐 — 차원 하나 얹는 게 물리학을 통째로 바꾼 사례.'}
];

const KNOW_PACK5=[
{k:['고려 몽골','강화 도성','삼별초'],ti:'고려의 몽골 저항 — 40년 항쟁',b:'1218년부터 1270년까지 고려는 세계 최강 몽골과 40년 넘게 버텼습니다. 수도를 강화도로 옮기고 산성·해상 기지에서 버틴 전략이죠. 결국 화친(태자 입원)으로 끝났지만 정권은 유지됐고, 삼별초는 추가로 3년 더 항전했습니다. 몽골 침공국 중 국가 체제를 온전히 유지한 극소수가 고려입니다.',f:'이 시기 몽골이 가져간 기술 중 하나가 조판 인쇄 — 유라시아 인쇄 문화 교류의 역설적 경로.'},
{k:['조선 건국','과전법','태조 이성계'],ti:'조선 건국과 과전법',b:'1392년 건국의 핵심 과제는 권력 재편의 제도화 — 과전법(1391)이 토지 지급 규정을 새로 짜며 고려 구세력의 경제 기반을 재편했습니다. 유교 국가 설계(경국대전까지 완성), 한양 천도, 4군 6진 개척이 초창기 3대 축. 사대부 중심 국가가 된 조선의 뼈대가 여기서 세워집니다.',f:'중앙집권+과전법+과거제의 조합은 신진 사대부(정도전·조광조 계보)가 신화(新花)로 성장한 토양입니다.'},
{k:['사림 훈구','사화','붕당'],ti:'사림과 훈구 — 100년 권력전',b:'14세기 중반부터 사림(영남 학막)이 훈구 세력과 과거·언론관(사관)을 통해 권력을 다퉜습니다. 4대 사화(1519, 1545, 1589, 1613)를 거치며 사림이 완승했고, 승리 후엔 동족 내지 서인·남인·소론·노론으로 분열 — 붕당정치의 시작이자 한계죠. 학문·언론 중심의 정치 문화는 조선의 특산물입니다.',f:'붕당은 견제·공론의 장이기도 했지만, 17세기 이후 환관처럼 번갈아 숙청하는 게임으로 변질됐습니다.'},
{k:['임진왜란','명량','이순신'],ti:'임진왜란 — 7년 전쟁의 골격',b:'1592년 정유재란 1598년까지 7년 — 조선은 평양 함락까지 밀렸다가 명군 참전·의병·수군으로 반격합니다. 결정 탕은 이순신의 해전 통제(한산도대첩·명량) — 일본의 보급선을 끊어 지상전을 고착시켰죠. 정유재란 때 명량(1597) 한 바다에서 13척이 일본 수백 척을 저지한 것이 정점, 노량으로 마무리됩니다.',f:'전쟁 후 동아시아 3국(명·조선·일본)이 모두 쇄신된 것 — 국제 질서 재편의 대전쟁이었죠.'},
{k:['병자호란','소현세자','삼전도'],ti:'병자호란과 소현세자',b:'1636년 청 태종이 12만 대군으로 침입, 인조는 남한산성에서 47일 버티다 삼전도에서 항복합니다. 대의명분(명 의리)과 현실(국력) 사이에서 조선은 굴복했고, 명 의주 등의 통신사가 끊기죠. 소현세자는 8년 볼모 생활 후 귀국해 개혁을 주장하지만 갑자기 죽고 — 조선은 북방론(명분)으로 마음의 승리를 대신했습니다.',f:'병자호란의 후유증은 "명분주의 정치" — 실학자들이 조선을 비판할 때 항상 인용하는 원점입니다.'},
{k:['실학','영조 정조','탕평'],ti:'실학과 영·정조 시대 — 조선의 재출력 시도',b:'18세기 영조·정조는 탕평책으로 붕당 소모를 끝내고, 실학자들(유형원·이익·정약용)은 토지·행정·기술 개혁을 설계했습니다. 정조는 규장각, 주작소, 수원 화성 등 개혁의 절정을 보이지만 1800년 급서로 개혁이 끊기죠. 실학의 한계: 실행 권력을 갖지 못한 "백서 위의 국가 설계"였다는 점.',f:'정약용의 목민심서는 200년 뒤 현대 행정학 교재로도 손색없는 수준 — 실학의 실전 밀도.'},
{k:['흥선대원군','쇄국','개화기'],ti:'흥선대원군과 개화기의 갈림길',b:'1864~1873 집권기 대원군은 세도 문벌을 탄압, 서원 축소, 경복궁 중건으로 왕권을 재건했습니다. 외교는 쇄국 — 병인양요·신미양요를 격퇴(성공처럼 보였지만 개방 압력만 쌓임). 아들 고종 시대에 개화파와 수구파가 갈리고 임오군란·갑신정변을 거치며 개혁 기회는 갈렸습니다. 일본 메이지 개혁(1868)과 정확히 겹친 시기라 아픔이 큽니다.',f:'비교사 질문: 왜 일본은 개화에 성공하고 조선은 30년 늦었나 — 통치 구조·재정·위기 인식의 3중 격차가 정답의 뼈대.'},
{k:['갑오경장','갑오개혁','근대 개혁'],ti:'갑오경장과 근대 개혁 — 늦은 혁명',b:'1894년 동학농민전쟁을 명분으로 청·일이 전쟁(청일전쟁)에 돌입, 승리한 일본이 갑오경장을 강요하며 청의 종주권을 끊습니다. 그 틈에서 갑오개혁(1894~1896)이 신분제 폐지, 과거제 폐지, 재정·행정 개편을 단행 — 조선의 본격 근대 개혁이 외세 개입 속에서 이뤄진 비극이죠. 을미개혁까지 이어지지만 러일전쟁 후 일본의 보호국화가 덮칩니다.',f:'1895년 을미사변(명성황후 살해)과 단발령 반발은 근대화의 "형식 강요"가 만든 정서적 상처의 표본입니다.'},
{k:['을사늑약','의병','국권회복'],ti:'을사늑약과 의병 항쟁',b:'1905년 을사늑약으로 외교권을 빼앗기고 1910년 한일병합 — 5년 사이 국권이 통째로 침탈됐습니다. 반발은 의병 전쟁(1905~1910)으로 이어지고, 정미의병은 근대식 무장 항쟁으로 진화했지만 조직전에서 밀렸죠. 이 시기 항일 자금·인적 기반이 상해 임시정부(1919)의 뼈대가 됩니다.',f:'안중근 이토 히로부미 저격(1909)은 만국공법 관점에서 제기한 "동양 평화를 깬 죄" — 국제법 논리로 저항한 사례.'},
{k:['3.1운동','임시정부','삼일절'],ti:'3·1운동과 대한민국 임시정부',b:'1919년 3월 1일, 고종 인산에 모인 민심과 민족대표 33인의 독립선언이 전국 700여 곳 시위로 번졌습니다 — 약 200만 명 참여 추정, 일본군의 무력 진압(제암리 학살)에도 멈추지 않았죠. 그 여파로 상해에 대한민국 임시정부 수립 — 헌법적 정통성의 원점입니다. 위임통치(국제연맹) 감시체제도 이때 시작됐죠.',f:'3·1운동의 교훈은 "비폭력 대중 동원의 힘"과 "조직 부재의 한계" — 임시정부가 둘 다 배운 결과물.'},
{k:['한국전쟁','6.25','휴전선'],ti:'한국전쟁 — 6·25의 개전과 전개',b:'1950년 6월 25일 북한이 전면 남침 — 3일 만에 서울 함락, 낙동강 방어선까지 밀렸다가 인천상륙작전으로 반전, 유엔군이 압록강 도달 후 중공군 개입으로 다시 밀리며 1951년부터 38선 부근 고착. 1953년 7·27 정전협정(휴전, 평화 아님)까지 3년 — 전사자 수백만, 한반도가 냉전의 최전선이 됩니다.',f:'전쟁의 대가가 한국·미국·중국·북한 각자 다른 교과서로 기억된다는 것 자체가 냉전 구조의 현재형입니다.'},
{k:['4.19','419 혁명','이승만'],ti:'4·19 혁명 — 민주주의의 첫 봉기',b:'1960년 3·15 부정선거가 도화선 — 고교생 시위가 4월 19일 대규모 봉기로 번졌고, 경찰 발포(186명 사망 추정)에도 멈추지 않아 이승만 정권이 하야합니다. 2·28 대구, 3월 마산이 선행 도화선이었죠. 4·19는 학생 주도 민주 항쟁의 원형이며, 그 성과는 5·16 쿠데타로 강탈당하지만 기억은 남습니다.',f:'이후 모든 민주 항쟁(부마·광주·6월)이 인용하는 정신적 원점 — "1960년 4월"입니다.'},
{k:['개발 독재','5.16','박정희'],ti:'개발 독재의 양면성',b:'1961년 5·16 군사 쿠데타 이후 30년간 권위주의 정권이 경제 개발을 최우선 시켰습니다 — 경제개발 5개년 계획, 수출 주도, POI(포항제철), 경부고속도로, 새마을운동이 성장 엔진이죠. 대가는 기본권 탄압(긴급조치), 노동 억압, 지역 편중, 그리고 10월 유신이라는 헌법 파괴입니다. "성장 vs 민주"의 딜레마가 한국 현대사의 중심 긴장이 됩니다.',f:'비교: 같은 시기 필리핀·아르헨티나와 대비된 한국·대만의 성장 — 개발 독재가 아니라 "개발 조건"(교육·토지개혁·수출 기회)의 차이가 핵심이라는 반론도 강력합니다.'},
{k:['부마항쟁','광주','5.18'],ti:'부마 항쟁에서 광주로 — 저항의 사슬',b:'1979년 10월 유신 독재 말기 부산·마산 시민·학생 항쟁(부마항쟁)이 유신 체제에 균열을 냈고, 12·12 신군부 쿠데타가 그 균열을 장악으로 바꿨습니다. 1980년 5월 광주에서 계엄군 진압에 맞서 시민이 도시를 10일간 지켰고(5·18), 무력 진압이 수백 명의 희생을 냈습니다. 이 두 사건이 1987년 6월 항쟁의 직접 계보입니다.',f:'광주의 기억과 보상 문제가 20년간 한국 정치의 상처로 남았고, 5·18 특별법(1995)으로 사법적 마침표를 찍었습니다.'},
{k:['6월항쟁','6.29','1987'],ti:'6월 항쟁과 6·29 선언 — 민주화의 완성',b:'1987년 박종철 군 고문치사 사건이 도화선 — 대학생·노동자·시민이 6월 한 달 내내 거리로 나왔고(최대 100만 명 규모), 호헤 철폐가 마지막 신음이었죠. 6월 29일 여당이 직선제 개헌 수용 선언 — 12월 대선으로 노태우 당선, 1992년 김영삼 정부로 정권 교체, 1997년 김대중 정부로 교대 정치가 완성됩니다.',f:'1987년 체제의 미완 과제(노동·지역·언론)가 지금도 한국 정치의 지도에 남아 있습니다.'},
{k:['imf 위기','외환위기','1997'],ti:'IMF 위기 — 원인과 극복',b:'1997년 태국에서 시작된 아시아 통화위기가 한국으로 번지면서 외환 보유고가 바닥(12월 구제금융 신청, 580억 달러)했습니다. 원인은 복합 — 기업의 과잉 차입·저수익 투자, 단기 외채 비중 급증, 금융 감독 공백, 그리고 위기 관리 실패. 정리해고·금융개혁·국민 금모음(금 227톤)으로 2001년 조기 상환에 성공했죠.',f:'위기의 유산은 양면 — 기업·금융 체질 개선 vs 비정형 고용 확대와 사회 안전망 부채감.'},
{k:['페르시아 전쟁','그리스','마라톤'],ti:'페르시아 전쟁 — 서양사의 원점',b:'기원전 490년 마라톤, 480년 살라미스 해전 — 작은 도시국가 연합이 대제국의 침공을 막았습니다. 승리의 배후는 팔랑크스·삼단노선 기술과 도시국가의 자발적 전투 의욕이었죠. 이 방어 성공이 아테네 민주주의 황금기를 열고 서양 문화 정체성의 뿌리가 됩니다. 페르시아 입장에선 제국 변경 사건이지만, 역사 기록은 승자가 쓰는 겁니다.',f:'헤로도토스가 이 전쟁을 기록하며 "역사"라는 장르 자체가 탄생합니다.'},
{k:['알렉산드로스','헬레니즘','알렉산드리아'],ti:'알렉산더와 헬레니즘 — 동서의 융합',b:'마케도니아의 알렉산더는 10년 만에 그리스에서 인도까지 정복(기원전 334~323)했고, 32세에 죽습니다. 정복의 진짜 유산은 제국이 아니라 헬레니즘 문화 — 그리스어가 국제어가 되고, 알렉산드리아 도서관이 지식 중심이 되죠. 그리스·페르시아·이집트·인도 문화가 섞인 시대가 로마의 밑토가 됩니다.',f:'제국은 사후 즉시 3분할됐지만 문화 융합은 300년 지속 — 정치 권력과 문화 확산의 시간차를 보여주는 교과서.'},
{k:['로마 공화정','카이사르','제정'],ti:'로마 공화정의 몰락 — 제도의 한계 실험',b:'로마 공화정은 집정관 2인·원로원·호민관의 견제 체계였지만, 영토 확장이 만든 부의 격차와 군대의 사유화(장군이 병사에게 토지·보수 지급)를 견디지 못했습니다. 카이사르의 루비콘(기원전 49)이 상징 — 제도는 군사력과 부앞에 무너졌고 옥타비아누스가 원수정(제정)으로 정리합니다. 공화국의 이름은 유지하면서 실질 권력은 1인 — 정치 꾸미기의 고전입니다.',f:'미국 건국자들이 로마 공화정 몰락을 반복 교재로 삼은 이유 — 견제 장치의 내부 붕괴 사례라서.'},
{k:['진시황','진나라','통일'],ti:'진시황 — 통일의 대가',b:'기원전 221년 진시황은 500년 분열을 통일하며 문자·화폐·척도·차축 간격까지 표준화했습니다 — 중국이 "한 문명"으로 지속하는 뼈대. 대가는 초강압 — 노역(만리장성·아방궁), 분서갱유(사상 통제)로 15년 만에 붕괴하죠. 후한(漢)이 유교+군현제로 부드러운 통일을 완성하는 게 역사의 반전입니다.',f:'1975년 발굴된 운몽진간이 보여준 진의 법제 — 폭정 이미지보다 훨씬 정교한 행정 국가였다는 재평가.'},
{k:['르네상스','문예부흥','피렌체'],ti:'르네상스는 왜 이탈리아 피렌체에서',b:'상업 자본(메디치 은행), 도시 국가 경쟁, 동로마 멸망(1453)으로 온 그리스 학자·고전 사본이 한곳에 모였습니다. 핵심 발상: 인간 중심(인문주의) + 관찰 기반(원근법·해부) — 신학의 세계를 인간의 눈으로 다시 그린 운동이죠. 다빈치·미켈란젤로·라파엘로가 예술과 과학의 경계를 허물었습니다.',f:'인쇄술(1450년대 군텐베르크)이 르네상스의 확산 엔진 — 지식 복제 비용 붕괴가 혁명을 만드는 첫 사례.'},
{k:['종교개혁','루터','가톨릭 분열'],ti:'종교개혁 — 95개 논제가 시작한 지진',b:'1517년 루터가 면벽부(죄를 돈으로 사는 제도)를 비판한 논제가 인쇄술을 타고 유럽을 갈랐습니다. 핵심: 구원은 성경의 믿음으로, 교황이 아닌 — 권위의 근원이 교회에서 텍스트로 이동했죠. 가톨릭·신교 대립은 30년 전쟁(1618~48)으로 폭발 후 종교적 관용(웨스트팔리아)을 억지로 배웁니다. 근대 개인주의·국민국가·자본주의의 문화적 밑토가 여기서 깔립니다.',f:'루터의 성경 독일어 번역이 표준 독일어를 만들었다 — 종교개혁이자 언어 민족주의의 탄생.'},
{k:['대항해시대','콜럼버스','신항로'],ti:'대항해시대 — 위험 투자가 만든 세계',b:'15세기 포르투갈이 아프리카 연안을 단계적으로 돌파(디아스 희망봉 1488) → 바스코 다 가마 인도 항로(1498), 스페인이 콜럼버스 서항로(1492)로 아메리카에 도달합니다. 기술(카라벨선·나침반·식품 저장), 자본(합자회사), 동기(향료·은·종교)가 맞물린 벤처의 시대죠. 대가는 식민지·노예무역·질병의 세계 시스템 — 현대 세계 질서의 원점입니다.',f:'아메리카 작물(감자·옥수수·고추)의 유라시아 전파(콜럼버스 교환)가 인구 폭발의 숨은 엔진입니다.'},
{k:['산업혁명','영국','증기기관'],ti:'산업혁명은 왜 영국부터',b:'조건 조합이 정답 — 석탄·철 자원, 노동력(인구·토지개혁), 자본(식민 무역), 시장(해군), 그리고 특허·과학 문화. 증기기관(왕트 1769 개량)이 광산 배수에서 출발해 직물·철도로 확산하며 에너지 체계를 바꿨죠. 도시화·노동 계급·환경 오염·제국주의가 동시에 태어난 이중적 혁명입니다.',f:'왜 중국·인도가 아니라 영국이었나 — "높은 임금 + 싼 에너지" 조합이 기계 대체를 유인했다는 경제사 답변이 유력합니다.'},
{k:['프랑스 혁명','바스티유','자유평등'],ti:'프랑스 혁명 — 1789년과 그 후유증',b:'재정 파산이 계기 — 삼부회 소집이 국민의회 선언으로, 바스티유 습격이 상징으로, 봉건제 폐지가 실질로 이어집니다. 인권선언(1789)의 "자유·평등"은 근대 정치의 DNA가 됐지만, 혁명은 급진화(테러정치)→군사 독재(나폴레옹)로 역주행하죠. 교훈: 혁명의 이상과 혁명 정치의 현실은 다른 존재입니다.',f:'나폴레옹 법전이 혁명의 성과를 유럽 전역에 고정 — 대포와 법전이 함께 수출된 아이러니.'},
{k:['미국 독립','헌법','연방제'],ti:'미국 독립과 헌법의 탄생',b:'1776년 독립선언(행복추구권), 1783년 승리, 1787년 필라델피아 헌법회의 — 13개 식민지가 연방(연합과 통합 사이)을 설계합니다. 핵심 기술: 권력 분립+견제균형, 연방-주 이중 주권, 수정 헌장(기본권). 노예 문제를 미뤄둔 타협(3/5 조항)이 80년 뒤 남북전쟁의 씨앗이 되는 대가를 치렀죠.',f:'세계에서 가장 오래된 성문 헌법 — 수정 27건의 절제가 미국 정치의 안정과 경직을 동시에 설명합니다.'},
{k:['나폴레옹','나폴레옹 전쟁','워털루'],ti:'나폴레옹의 부침 — 천재와 야망의 한계',b:'프랑스 혁명의 혼란을 군사 천재가 질서로 바꾼 사례 — 이탈리아 원정, 나일, 아우스터리츠로 정점. 하지만 대륙 봉쇄와 러시아 원정(1812, 60만 → 3만 귀환)이 몰락의 갈림길, 워털루(1815)로 종료되죠. 유산은 법전·행정·측량(미터법)의 제도 수출 — 군사 실패와 제도 성공이 공존하는 드문 인물입니다.',f:'나폴레옹의 명언이 아니라 나폴레옹 법전이 유럽을 바꿨다 — 무력의 수명과 제도의 수명의 차이.'},
{k:['1차대전','참호','사라예보'],ti:'1차 대전 — 도화선과 참호의 지옥',b:'1914년 사라예보 암살이 도화선이지만 진짜 원인은 연쇄 동맹(양측 2개 진영), 군비 경쟁, 제국주의 충돌, 그리고 "빨리 끝날 것"이라는 공통 착각. 기관총+참호+포격의 방어 우세가 4년 교착, 베르됭·솜에서 수백만 사상자죠. 종전은 1918년 — 베르사유 조약의 가혹한 배상이 2차 대전의 씨앗이 됩니다.',f:'전쟁 후 오스만·오스트리아 제국 해체가 만든 국경이 오늘날 중동·발칸 분쟁의 지도를 그렸습니다.'},
{k:['대공황','뉴딜','세계 경제 위기'],ti:'대공황의 메커니즘 — 1929년 무엇이 무너졌나',b:'주가 폭락이 시작이 아니라 중간 단계 — 진짜 사슬은 은행 도산(신용 수축)→수요 붕괴→실업 폭증→더 많은 도산의 악순환. 금본위제가 각국의 구제 금융 손을 묶었고, 관세 전쟁(스무트-홀리)이 세계 무역을 반토막 냈죠. 루스벨트 뉴딜(공공 투자·금융 규제·사회보험)이 정부 개입의 전환점, 케인스 경제학의 무대입니다.',f:'교훈은 예방 장치 — 예금보험, 중앙은행 최종 대출자 역할, 금융 규제가 "다시는 1929"를 막는 3중 안전핀.'},
{k:['2차대전','히틀러','전체전'],ti:'2차 대전 — 왜 다시 전쟁인가',b:'베르사유의 굴욕+대공황으로 독일 민심이 극단으로, 나치가 집권(1933)하며 재무장·팽창(오스트리아·체코·폴란드)이 이어집니다. 1939~1945, 유럽·태평양·북아프리카에서 총력전 — 홀로코스트(유대인 600만 학살)라는 문명의 최악이 동시대에 일어났죠. 핵폭탄(1945)이 전쟁 종결과 동시에 "다시는 총력전"의 금지 조항을 인류에 새겼습니다.',f:'전후 설계(UN, 브레튼우즈, 유럽 통합, 기본권 국제법)가 2차 대전의 반대 방향으로 세계를 다시 지었습니다.'},
{k:['냉전','베를린','미소 대립'],ti:'냉전 — 총알 대신 대리전',b:'1947~1991, 미국 vs 소련이 이념·군비·우주·대리전(한국·베트남·아프가니스탄)으로 세계를 양분했습니다. 베를린(1948 봉쇄, 1961 장벽)이 상징, 핵 억지(MAD)가 직접 전쟁을 막는 아이러니의 평화죠. 1989년 베를린 장벽 붕괴 → 1991년 소련 해체로 종결, 세계는 단극 체제로 넘어갑니다.',f:'냉전 유산이 오늘도 유효 — NATO 확장, 한반도 분단, 우주·반도체 기술 대립의 뼈대가 냉전 지도입니다.'},
{k:['탈식민지','독립운동','제3세계'],ti:'탈식민지화 — 제국의 해체',b:'2차 대전 후 30년간 인도(1947), 아프리카 50여 국(1960년대), 동남아가 독립 — 1945년 유엔 창설 때 51개국이 1970년엔 127개국으로 폭증합니다. 경계는 종교·부족·언어가 아니라 제국의 자의적 자르기가 많아 국경 분쟁·내전이 후유증으로 남죠. 경제적으로는 정치 독립 뒤에도 무역·부채 구조의 신식민주의가 과제로 남았습니다.',f:'인도 분할(인도·파키스탄)의 대이동(1500만 명) — 식민지 국경이 만든 인류 최대급 강제 이주.'},
{k:['개혁개방','덩샤오핑','중국 경제'],ti:'중국 개혁개방 — 1978년의 대전환',b:'문화대혁명 후 덩샤오핑이 "일부가 먼저 부자가 되자"로 방향을 틀었습니다 — 농촌 가족경영(홍촌 실험), 특구(선전), 외자 유치, WTO 가입(2001)으로 40년간 연평균 9% 성장. 8억 명을 빈곤에서 꺼낸 인류 사상 최대 규모 소득 향상이죠. 대가는 환경 오염, 격차, 그리고 정치 개혁의 미완(천안문 1989).',f:'선전 — 어촌이 40년 만에 1700만 도시가 된 실험이 "시험-확산" 개혁 방법론의 표본입니다.'},
{k:['소련 붕괴','페레스트로이카','고르바초프'],ti:'소련 붕괴의 원인 — 왜 1991인가',b:'경제 경쟁 실패(계획경제의 정보·동기 문제), 군비 부담(국방비 15~20%), 석유 가격 폭락(1986), 고르바초프의 개혁(페레스트로이카·글라스노스트)이 통제를 풀자 민족·공화국 이탈이 연쇄 — 1991년 8월 쿠데타 실패가 최후의 호. 15개국으로 분해됐습니다. 핵은 우크라이나·카자흐에서 러시아로 집중되는 협정이 뒤따랐죠.',f:'교훈: 개혁의 순서 — 경제 개선 없이 언론 자유화를 먼저 풀면 체제 신뢰가 먼저 무너진다는 아픈 사례연구.'},
{k:['인플레이션','물가','통화 가치'],ti:'인플레이션의 해부 — 물가는 왜 오르나',b:'수요 초과(너무 많은 돈이 너무 적은 물건을 쫓음), 비용 상승(원유·임금), 기대 심리(오를 것을 사서 오게 만듦)가 3대 엔진입니다. 온건한 2%는 경제 윤활유지만 두 자릿수는 사회의 적 — 예금을 녹이고, 고정소득층을 타격하고, 통화 신뢰를 무너뜨리죠. 중앙은행이 금리로 수요를 누르는 게 표준 처방, 1970년대 볼커의 고금리 쇼크(20%)가 성공 사례입니다.',f:'하이퍼인플레(바이마르, 짐바브웨)의 공통점 — 정부 재정 적자를 화폐 발행으로 때우는 순간 발생합니다.'},
{k:['디플레이션','디플레','일본 상실의 30년'],ti:'디플레이션이 더 무서운 이유',b:'물가가 내리면 소비·투자를 미루고(나중에 싸짐), 실질 부채 부담이 커지고(월급 줄어도 이자 그대로), 임금이 깎이는 나선이 돌아갑니다 — 악순환에 이자율이라는 약이 안 듭니다(금리 0까지 내려가면 무기가 없음). 일본이 30년 버티는 유동성 함정, 2008년 후 유럽·미국의 "낮은 인플레" 시대가 그 실례입니다.',f:'그래서 중앙은행들은 0%가 아닌 2%를 목표로 — 약간의 인플레가 완충재 역할을 합니다.'},
{k:['중앙은행','통화정책','기준금리'],ti:'중앙은행과 통화정책 — 금리가 세계를 움직이는 법',b:'중앙은행은 기준금리를 올리면 대출·소비·투자를 식혀 물가를 잡고, 내리면 경기를 부양합니다. 전승 경로: 대출 비용 → 수요 → 물가, 그리고 환율·자산 가격 경로가 동시 작동. 무기는 두 개 — 가격(금리)과 양(채권 매입, QE). 제도적 핵심은 정부로부터의 독립성 — 선거 압력에 흔들리면 인플레가 이깁니다(역사적으로 실증).',f:'금리 1%p가 주택 대출·환율·주식 평가에 파문을 일으키는 경로를 따라가 보면 경제 뉴스의 절반이 읽힙니다.'},
{k:['환율','실환율','통화 가치 결정'],ti:'환율의 본질 — 돈의 환전 가격은 왜 변하나',b:'장기적으로는 구매력(같은 버거의 가격 차이), 단기적으로는 금리 차(수익 높은 통화로 이동), 무역 수지, 위험 회피 심리가 결정합니다. 환율 오르면(원화 약세) 수출에 유리하지만 수입 물가·해외 여행이 비싸지죠. 자국 통화가치는 국가 신용 — 터키·아르헨티나 사례처럼 신뢰가 무너지면 물가가 폭주합니다.',f:'"빅맥 지수"라는 농담 같은 지표가 실제로 구매력평가의 교육용 도구로 쓰입니다.'},
{k:['gdp','국내총생산','경제 규모'],ti:'GDP — 무엇을 세고 무엇을 못 세나',b:'GDP는 한 나라에서 1년간 생산된 최종 재화·서비스의 시장 가치 — 소비+투자+정부지출+순수출의 합. 성장·침체·1인당 소득 비교의 표준 자이지만 한계가 명확: 가사노동·자원봉사·자연 파괴(정화 비용은 +로 계산)·소득 격차가 안 보입니다. 지표가 아니라 렌즈 — 무엇을 세느냐가 정책을 결정하죠.',f:'대안 지표: 행복 GDP(부탄), 인간개발지수(HDI), 사회진보지수 — GDP 이전의 "국가 성적표" 논쟁이 진행 중입니다.'},
{k:['경기순환','호황 불황','경제 주기'],ti:'경기순환은 왜 반복되나',b:'호황(낙관·투자·고용)→과열(인플레·과잉 투자)→조정(금리·재고 조정)→침체(청산)→회복의 파도 — 자본주의의 호흡입니다. 외부 충격(유가·전쟁), 신용 사이클(부채 늘었다 줄기), 심리(과잉 낙관↔과잉 비관)가 겹쳐 주기가 3~10년 비정기적으로 옵니다. 정책의 목표는 주기 제거가 아니라 충격 완화(자동 안정장치+반경기 정책)죠.',f:'지표 조합: 선행(주식·신규 채용)→동행(산업생산)→후행(실업률) — 경제 뉴스를 3단 레이어로 읽는 법.'},
{k:['거품','튤립광란','닷컴'],ti:'거품의 해부학 — 튤립에서 닷컴까지',b:'거품 공식: 새 스토리("이번엔 다르다")→낙관 유입→가격 상승이 상승을 검증→레버리지 유입→점프→공포 반전→붕괴. 1637 튤립, 1720 남해, 1929 주식, 2000 닷컴, 2008 부동산이 같은 극본의 리메이크죠. 구별법: 기술은 실재해도 가격이 "미래를 전부 선불"하면 거품 — 철도도 닷컴도 기술은 살아남았습니다.',f:'맨스키(거품이 있는 줄 알면서도 "더 비싸게 팔 수 있다")가 마지막 물량군 — 거품의 심리학적 완성형.'},
{k:['2008 금융위기','서브프라임','리먼'],ti:'2008 금융위기 — 주택이 세계를 무너뜨린 방법',b:'저금리+주택 상승 신화로 신용등급 낮은 대출(서브프라임)이 팽창, 은행들이 이 대출을 쪼개 담보부 채권(CDO)으로 재포장해 전 세계에 팔았습니다. 평가사가 AAA를 도장 찍었고, 주택 가격이 꺾이자 연쇄 기본불이행→리먼 파산(2008.9)→세계 신용 동결죠. 정부 구제(7000억 TARP), 세계적 긴축, 그리고 "너무 커서 못 망가진다"의 규제 개혁(바셀 III)이 후속입니다.',f:'영화 "빅 쇼트"의 공매도 주인공들이 본 것: 아무도 읽지 않는 계약서의 조항 — 위기는 정보가 아니라 관심의 부재에서 옵니다.'},
{k:['비교우위','무역','자유무역'],ti:'비교우위 — 무역이 이기는 게임인 이유',b:'리카르도의 1817년 통찰: 모든 걸 못 하는 나라도 "가장 덜 못하는" 분야에 특화해 무역하면 양국이 이득입니다 — 절대 능력이 아니라 기회비용의 차이가 무역의 이유. 세계 빈곤 감소의 최대 공신(무역·개방)이지만, 이전 산업·지역의 피해가 실재한다는 반론도 맞습니다 — 이득을 재분배하는 정책 없이 개방만 하면 정치가 반발합니다.',f:'관세의 역사 교훈: 보호로 육성(한국 자동차)도 있고, 보호에 잠식(수입대체)도 있었습니다 — 차이는 "수출 압력" 유무.'},
{k:['블록체인','비트코인','암호화폐'],ti:'블록체인·비트코인 — 중개자 없는 신뢰',b:'블록체인은 거래 기록을 블록으로 묶어 전 노드에 복제, 해시로 사슬처럼 연결 — 하나를 조작하면 전체가 들통나는 구조입니다. 비트코인(2009)은 이 기술로 "은행 없이 화폐 발행·송금"을 시연했고, 채굴(작업증명)이 보안과 인플레 제한(2100만 개)을 동시에 풀죠. 강점(검열 저항)과 약점(에너지·변동성·사기)이 같은 뿌리에서 나옵니다.',f:'가치 논쟁 — "디지털 금"이냐 "현금흐름 없는 자산"이냐. 기술의 확실한 성과는 화폐보다 스마트계약·공급망 기록입니다.'},
{k:['케인스','하이에크','경제학 논쟁'],ti:'케인스 대 하이에크 — 정부의 손은 어디까지',b:'케인스: 불황은 수요 부족 — 정부가 지출로 수요를 메워야(적자도 OK). 하이에크: 시장의 가격 신호를 왜곡하는 개입이 거품을 키운다 — 침체는 청산(과잉 정리)의 아픔이다. 1930년대 대공황 이후 케인스 우세 → 1970년대 스태그플레이션에 하이에크·프리드먼 부활 → 2008·2020 위기엔 케인스 복귀 — 진실은 상황 의존입니다.',f:'실무 합의: 통화정책은 인플레 담당, 재정은 위기 시 최후의 수요자 — 칼과 망치의 구분입니다.'},
{k:['삼권분립','권력분립','법원 독립'],ti:'삼권분립은 왜 필요한가',b:'권력은 스스로를 억제하지 못한다 — 몽테스키외의 통찰을 제도화한 것이 입법(의회)·행정(정부)·사법(법원)의 3분립입니다. 각 권력이 다른 둘을 견제(거부권·탄핵·위헌 심사)하되, 한 권력이 전부를 장악하면 견제가 무용지물 — 민주주의 후퇴의 표준 신호가 바로 여기서 나타납니다. 사법 독립이 마지막 보루인 이유죠.',f:'법원 판사 임기 보장, 의회 예산 승인권, 언론 자유 — "견제 실패 실험"이 많은 나라의 역사에 있습니다.'},
{k:['헌법','법률 위계','기본권'],ti:'헌법과 법률의 위계',b:'헌법은 최상위 규범 — 법률·명령·조례가 전부 헌법에 위배되면 무효(위헌법률심사). 기본권(인간 존엄·평등·자유)은 국가 권력이 아무리 다수결로도 침범 못 하는 영역을 긋는 것이죠. 개헌 문턱이 높은 이유 — 다수의 순간 감정으로 소수의 권리와 게임 규칙 자체를 바꾸지 못하게 하는 안전장치입니다.',f:'"기본권 제한 3단계 테스트"(법률 근거·공공복리·비례)가 헌법재판소의 표준 계산기입니다.'},
{k:['무죄추정','형사재판','입증책임'],ti:'무죄 추정의 원칙',b:'피의자는 유죄가 입증될 때까지 무죄 — 입증 책임(합리적 의심 이상)은 전부 국가에 있고, 피고는 스스로 무죄를 증명할 필요가 없습니다. 이 역전(피고가 증명)이 되는 순간 고문·억울한 옥살이가 제도화됩니다. 역사적으로 "국가가 국민을 상대로 이길 확률"을 인위적으로 낮춰두는 설계 — 악인이 몇 놓치더라도 억울한 옥살이를 막는 교환입니다.',f:'언론의 "유력 혐의" 프레임과 무죄추정의 긴장 — 재판 전 공개 논의가 실제 판결에 미치는 영향이 연구됩니다.'},
{k:['죄형법정주의','nulla poena','형법 원칙'],ti:'죄형법정주의 — 법 없으면 벌 없다',b:'행위 시점에 법으로 정해진 범죄·벌이 아니면 처벌할 수 없다 — 국가의 형벌권에 예측 가능성을 부과하는 규칙. 소급입법 금지(새 법으로 과거를 처벌 못 함), 유추해석 금지, 명확성 원칙이 3대 축이죠. 어두운 역사(임의 처벌·군주 재량)에서 나온 방어선 — "정의감"이 아무리 강해도 법률 없는 처벌은 금지입니다.',f:'이 원칙이 강할수록 국가 권력 남용의 문이 좁아집니다 — 형사 절차의 질이 민주주의의 온도계라는 말의 근거.'},
{k:['소선거구','비례대표','선거제도'],ti:'소선거구제 vs 비례대표제',b:'소선거구(지역 1명)는 양당제로 기울고(들표 낭비), 정권 안정·지역 대표가 강점. 비례대표(득표율 반영)는 다당제·다양성(소수 의견)이 강점이지만 연립 정부가 잦아집니다. 한국은 소선거구+비례 보정(연동형 일부) 하이브리드 — 안정성과 다양성의 타협안이죠. 게리맨더(선거구 획정 조작)가 소선거구제의 만성 부작용입니다.',f:'같은 표가 의석률로 얼마나 왜곡되는지 계산해보면 — 제도가 결과를 만든다는 걸 숫자로 확인할 수 있습니다.'},
{k:['연방제','단일제','국가 구조'],ti:'연방제와 단일제 — 권력을 수직으로 나누기',b:'연방제(미국·독일)는 중앙과 지방이 헌법으로 권한을 나눠 각자 독립 — 지역 다양성·실험(주별 정책)에 강하지만 통일 규제·위기 대응이 느릴 수 있죠. 단일제(한국·프랑스)는 중앙 집권 — 규격화·형평에 유리하지만 지역 특성 소통이 약합니다. 교육·경찰·세금의 소관 배분이 실질 차이를 만듭니다.',f:'EU는 국가들 사이의 "준연방" 실험 — 화폐 통일+재정 분권의 긴장이 그리스 위기의 뿌리였습니다.'},
{k:['국제법','조약','주권'],ti:'국제법의 힘과 한계',b:'국제법은 조약·관습으로 이뤄지지만 중앙 경찰이 없습니다 — 이행을 강제하는 유엔군은 안보리 거부권 앞에서 자주 마비되죠. 그럼에도 국제법이 작동하는 영역(외교·무역·해양·항공·우주)은 광대 — 상호 이익과 명분 비용이 강제 장치를 대신합니다. 인도적 위기에서 "명분의 법"과 "권력의 현실"이 충돌하는 게 상수입니다.',f:'세계무역기구(WTO) 분쟁해결은 국제법의 성공 사례 — 판결을 지키는 이유가 무역 보복의 자동성이라는 설계.'},
{k:['참정권','선거권','보통선거'],ti:'참정권의 역사 — 투표권을 얻어낸 투쟁',b:'19세기 유럽·미국에서 선거권은 재산 소유 남성에 한정됐습니다. 차티스트 운동→1860~1910년대 보통선거 확대, 여성 참정권(뉴질랜드 1893 최초, 한국 1948 전면)까지 100년의 투쟁이죠. 투표 연령 18세 하향도 1970년대 이후 세계적 흐름 — "누가 표를 가지나"의 지도가 계속 다시 그려집니다.',f:'투표율의 사회학 — 투표 자체가 의무(호주 벌금)인 나라와 권리인 나라의 20%p 격차가 제도의 힘을 보여줍니다.'},
{k:['사회계약','국가 기원','홉스 록소'],ti:'국가는 왜 생겼나 — 사회계약 이론',b:'홉스: 자연상태는 만인의 만인에 대한 투쟁 — 안전을 위해 권리를 국가에 위탁하자(강력한 국가). 로크: 국가의 임무는 생명·자유·재산 보호 — 권력 남용 시 저항권(미국 독립의 뼈대). 루소: 일반의지(공공선)에 기반한 인민주권 — 프랑스 혁명의 이론죠. 3인의 답이 다른 이유: 국가의 무서움과 필요함 사이의 서로 다른 저울질입니다.',f:'현대 확장: 로웰스 "정의론" — 무지의 베일 뒤에서 설계한 사회가 공정하다는 사고실험이 복지국가의 철학적 지반.'},
{k:['세금','조세','누진세'],ti:'세금의 역할과 조세 정의',b:'세금은 3가지 일을 합니다 — 재정 조달(국방·교육·인프라), 재분배(소득 격차 완충), 행동 유도(담배세·탄소세). 조세 정의의 축은 "누가 얼마를"(수직 형평: 누진세 vs 비례)과 "무엇을 과세하나"(소득·소비·자산·부동산)입니다. 러퍼 곡선(세율↑≠세수↑)의 실증 구간이 논쟁의 중심이죠. 탈세·조세피난처가 세계 규모로 형평을 침식 중입니다.',f:'최적 조세 논쟁의 실전 질문 — "부유층 최고세율 50%대가 경제 성장을 해치는가"의 실증 연구는 상반된 결과가 공존합니다.'}
];

const KNOW_PACK6=[
{k:['소크라테스','산파술','문답법'],ti:'소크라테스 산파술 — 질문으로 낳는 지식',b:'소크라테스는 답을 가르치지 않고 연쇄 질문으로 상대의 주장을 정의→모순→수정으로 몰아갔습니다. "나는 내가 모름을 아는 사람" — 지식의 겸손이 탐구의 출발점이라는 태도죠. 아테네는 그를 "청년을 타락시켰다"고 고해했고, 그는 도주 대신 고집(자신의 원칙을 사형으로 지킴). 플라톤이 그의 대화를 기록해 서양 철학 전체가 이 문답의 각주입니다.',f:'스스로에게도 적용 가능한 훈련 — 내 확신 하나를 골라 "왜?", "예외는?", "반례는?"을 3회 이어붙이면 산파술의 첫 경험.'},
{k:['플라톤 동굴','플라톤','이데아'],ti:'플라톤 동굴 비유 — 그림자와 진짜',b:'동굴에 묶인 사람들이 벽에 비친 그림자를 "실재"로 믿다가, 한 명이 밖으로 나와 진짜 태양(이데아)을 봤다는 비유 — 감각의 세계와 이지의 세계를 갈랐습니다. 뿐만 아니라 교육의 정의(돌아와서 해방하려는 노력), 진리와 편견의 충돌까지 담고 있죠. 영화 매트릭스의 뼈대도 이 비유입니다.',f:'이데아론이 강한 형이상학이라 아리스토텔레스가 "형상은 사물 속에 있다"로 반박 — 서양 철학 2000년이 이 한 줄 토론의 확장.'},
{k:['아리스토텔레스','덕 윤리','황금비율'],ti:'아리스토텔레스 덕 윤리 — 좋은 사람이 되는 기술',b:'윤리의 목표는 규칙 숙달이 아니라 인격 형성 — 용기는 겁쟁이(부족)와 무모(과잉)의 중간, 판단은 상황의 중용을 찾는 실천 지혜(프로네시스)입니다. 덕은 태어나는 게 아니라 반복 훈련으로 몸에 배는 습관이죠 — "우리가 반복해서 하는 것이 곧 우리 자신"이라는 문장이 실용주의 심리학의 조상. 행복(에우다이모니아)은 쾌락이 아니라 "잘 사는 상태"로 정의됩니다.',f:'현대 응용: 습관 과학·기업 문화 논의가 전부 "규칙보다 성격"이라는 덕 윤리의 환류입니다.'},
{k:['데카르트','방법적 회의','코기토'],ti:'데카르트 방법적 회의 — 의심의 기둥',b:'모든 걸 의심해보자 — 감각은 속고, 세상은 꿈일 수도, 심지어 나를 속이는 악마가 있을 수도. 그런데 의심하는 과정 자체는 의심할 수 없습니다 — "나는 생각한다, 고로 존재한다(코기토)". 이 단단한 기둥 하나에서 지식 체계를 다시 세우려는 프로젝트가 근대 철학의 출발선이죠. 결과물(영향-물체 이원론)은 반박됐지만 방법은 살아남았습니다.',f:'주의: 코기토는 "나의 우월성 증명"이 아니라 "무엇이 남는가"의 기술 — 의심의 연습은 방어적 회의가 아니라 청소입니다.'},
{k:['칸트','정언 명법','의무론'],ti:'칸트 정언 명법 — 보편화되는 규칙만',b:'"네 의지의 준칙이 언제나 보편 법칙이 되도록 행위하라" — 내 행동의 규칙을 모두가 동일하게 적용해도 성립하는지를 묻는 절차입니다. 거짓말을 보편화하면 약속 자체가 신뢰 불가로 무너지죠. 두 번째 정식화: 인간을 수단으로만 취급하지 말고 동시에 목적으로 대하라 — 인간 존엄 개념의 철학적 뼈대, 현대 인권의 문법입니다.',f:'한계 실험: "살인자가 친구 위치를 물으면 거짓말도 안 된다"는 벤자민의 반례 — 의무론의 어려움을 보여주는 고전 퍼즐.'},
{k:['공리주의','밀','최대 행복'],ti:'공리주의 — 최대 다수의 최대 행복?',b:'행위의 옳고 그름은 결과(행복 총량)로 판단한다 — 벤담이 정식화하고 밀이 질(고차 쾌락)까지 확장했습니다. 정책(비용편익 분석), 동물 복지(고통 수용 범위 확장), 효율 논쟁의 뼈대가 되었죠. 반례: 죄 없는 1명을 갈아 5명을 구하는 문제 — 총량 계산이 개인 권리를 짓밟는 순간이 존재합니다. 규칙 공리주의(규칙의 총효용)로 보완 시도 중입니다.',f:'피터 싱어의 기부 논증 — "물에 빠진 아이 앞에서 옷이 아까워 안 구하나"의 확장이 현대 윤리 최대 논쟁 중 하나.'},
{k:['실존주의','사르트르','존재'],ti:'실존주의 — 존재가 본질에 앞선다',b:'사르트르: 인간은 설계도 없이 던져지고, 행동으로 자신을 만듭니다 — "인간은 자유로이 자신을 정의해야 한다는 형벌"이죠. 캉가: 어리석음은 악의가 아니라 "생각하지 않는 태도"에서 나온다는 반성. 니체도 이 계보 — 가치를 스스로 만들라는 초인. 실존주의는 절망론이 아니라 책임론입니다: 선택 안 한 것도 내 선택으로 갚아야 하니까요.',f:'실용 읽기: 상황이 주어진 게 아니라 해석이 주어진다 — 의미 프레임을 바꾸는 훈련의 철학적 면허.'},
{k:['니체','신은 죽었다','가치전복'],ti:'니체 — "신은 죽었다" 그 다음은',b:'"신은 죽었다"는 경축도 비탄도 아닌 진단 — 절대 가치의 근거(종교)가 서구 사회에서 실질적으로 무너졌다는 보고입니다. 공허를 채우는 두 반응: 수동적 허무주의(편안한 위선) vs 적극적 재평가(자기 가치 창조) — 후자가 초인이죠. "영원 회귀" 테스트: 이 인생을 똑같이 무한 반복해도 좋다고 답할 수 있는가 — 삶의 승인 척도입니다.',f:'주의: 나치가 도용한 "권력에의 의지"는 여동생의 편집 탓이 큼 — 니체 본인은 반유대주의를 명시적으로 경멸했습니다.'},
{k:['비트겐슈타인','언어 게임','철학 치료'],ti:'비트겐슈타인 — 언어의 한계가 세계의 한계',b:'초기 비트겐슈타인: "말할 수 없는 것에 대해선 침묵해야 한다" — 언어가 세계의 논리 그림이라는 관점. 후기 비트겐슈타인: 의미는 사전 정의가 아니라 사용 — "언어 게임"과 "가족 유사성"으로 바뀌죠. 철학 문제의 상당수는 잘못된 언어 사용의 경련이라는 치료 관점 — 문제를 푸는 게 아니라 녹이는 겁니다.',f:'"박사 박사박사 박사박사" 같은 모호 사례 — 사전 정의의 한계가 후기 전환의 도화선이었습니다.'},
{k:['자유의지','결정론','책임'],ti:'자유의지 문제 — 신경과학이 답했나',b:'물리 법칙이 전부를 결정한다면(혹은 양자 우연이라도) "내가 고른다"는 착각인가? 리베트 실험(뇌가 행동보다 수백 밀리초 먼저 움직임)이 화제지만 해석은 분열 — 준비 동작과 결정의 구분, 그리고 "취소권(veto)" 존재 논쟁이 계속됩니다. 실용적 대응: 호환론 — 자유란 강제 없이 자기 이유대로 움직이는 것, 책임 제도는 그 위에서 성립한다는 입장이 주류입니다.',f:'신경과학은 뇌의 결정 메커니즘을 자세히 밝히지만 "왜 자유라 부를 수 없나"의 정의 자체는 여전히 철학 문제입니다.'},
{k:['의식','hard problem','좀비 논증'],ti:'의식의 어려운 문제',b:'뇌가 정보 처리하는 건 알겠는데 — 왜 그게 "느껴질까"(질적 경험, 퀄리아)? 이 어려움은 생물학적 해부로 풀리지 않는 구조적 질문이라 처머스가 명명했죠. 물리주의(뇌 활동=의식)와 이원론 사이 판이 이론들(전역 작업 공간, 통합정보이론 IIT, 판압시키즘)이 경쟁 중. "철학적 좀비"(물리적으로 완전한데 느낌이 없는 존재)가 개념적 시험대입니다.',f:'AI의 의식 여부 판단 기준이 없다는 것 자체가 이 문제의 실전적 무게 — 행동 유사성과 내적 경험은 다른 문제입니다.'},
{k:['경험론','합리론','지식 기원'],ti:'경험론 대 합리론 — 지식은 어디서 오나',b:'합리론(데카르트·스피노자·라이프니츠): 이성의 추론과 선천 관념이 지식의 근원. 경험론(로크·흄): 마음은 백지 — 전부 감각 경험에서 조립됩니다. 흄은 경험론을 밀어붙여 "인과는 반복의 습관"이라는 충격 결론에 도달했죠. 칸트의 종합: 경험이 재료, 이성이 틀 — "자연과학은 어떻게 가능한가"의 새 질문을 엽니다.',f:'현대 인지과학의 중재안: 신생아는 선천적 편향(얼굴 선호 등)을 갖고 태어나지만 대부분 지식은 경험에서 — 둘 다 절반 맞음.'},
{k:['확증편향','인지편향','믿음 갱신'],ti:'확증편향 — 내 주장을 지지하는 것만 본다',b:'인간은 자기 믿음을 지지하는 정보를 찾고(탐색), 반대 정보는 깎아내리고(해석), 기억도 선택합니다 — 3중 여과 장치. 소셜미디어 알고리즘이 이 편향을 증폭 — 정보 다이어트가 이미 맞춤 필터링된 상태죠. 처방은 개인 차원: 반대 논거를 "최대한 강한 형태"로 먼저 표현하는 강철맨 훈련, 그리고 추측을 명시적으로 라벨링하는 습관입니다.',f:'자기 점검 질문: "이 결론이 반대라면 나는 무엇을 봤을까?" — 이 질문에 답 못 하면 아직 믿음이 아니라 소속감을 갖고 있는 겁니다.'},
{k:['앵커링','초기값','협상 심리'],ti:'앵커링 효과 — 첫 숫자가 세상을 삼킨다',b:'첫 제시된 값(앵커)이 이후 모든 추정을 끌어당깁니다 — 무작위 숫자를 보고도 추정이 기울고, 협상에서 첫 제안이 결과의 상당 부분을 결정합니다. 소매의 "정가 99,000 → 59,000"이 앵커 조작이죠. 방어: 앵커를 명시적으로 인지("이건 무작위에 가까운 시작점"), 자체 기준값을 사전에 계산해 메모, 범위로 반응(단일 숫자에 갇히지 않기).',f:'재판 배상금 실험 — 원고 측이 터무니없이 높은 청구를 해도 배상액 평균이 올라가는 실증이 법정 심리학의 고전.'},
{k:['손실 회피','전망이론','카너먼'],ti:'손실 회피와 전망이론 — 잃는 게 두 배 아프다',b:'같은 액수라 잃는 고통이 얻는 기쁨의 약 2배 — 이 비대칭이 사람의 경제 행동을 왜곡합니다(확실한 손실 회피, 손절 실패, 유지 편향). 카너먼·트버스키가 정식화한 전망이론은 "이득 틀"과 "손실 틀"에서 사람이 반대로 결정한다는 걸 보였죠 — 프레임만 바꿔도 선택이 뒤집힙니다. 행동경제학 전체의 기초(노벨상 2회 수상의 뿌리).',f:'기본소득·기부 메시지 설계에서 "손실 프레임"("안 하면 잃는다")이 이득 프레임보다 효과적인 실증이 꾸준합니다.'},
{k:['밀그램','복종 실험','권위'],ti:'밀그램 복종 실험 — 보통 사람은 어디까지 따르는가',b:'"기억 학습" 명목으로 참가자가 연구자 지시에 따라 타인에게 (진짜처럼 보이는) 전기 충격을 단계적으로 가하게 됐습니다 — 65%가 최고 전압까지 갔습니다. 권위(실험복), 점진 에스컬레이션, 책임 분산, 상황의 힘이 원인이죠. 홀로코스트 가해자의 "명령이었을 뿐"에 대한 심리학적 답변으로 회자됐습니다.',f:'주의: 재해석 연구 — 참가자들이 "실험의 과학적 가치"를 믿었기에 따랐다는 보고도 있습니다. 순수 악이 아니라 상황+명분의 합작.'},
{k:['스탠퍼드 감옥','짐바도','역할의 힘'],ti:'스탠퍼드 감옥 실험 — 유명하지만 절반은 붕괴됐다',b:'1971년 대학생을 간수·수감자로 무작위 배정하자 역할이 인격을 덮친다는 충격 결과로 유명했죠. 그러나 재평가 연구: 간수들에게 "잔인하게 하라"는 지시 힌트가 있었고, 참가자 연기 동기가 크며, 표본이 극히 작습니다 — 실험의 결론력은 크게 하향 조정됐습니다. 가치: 과학도 자기수정을 해야 한다는 실례로 오히려 교육적입니다.',f:'교훈 2개: 상황의 힘은 실재하되 "실험이 증명했다"고 말하기 전엔 방법론을 물어라 — 비판적 읽기의 표준 교재.'},
{k:['마시멜로 실험','자기통제','미셸'],ti:'마시멜로 실험 — 재검토된 유명 이야기',b:'1970년대 미셸의 실험: 어린이가 마시멜로 1개를 참으면 2개 — 후속 추적에서 이 자기통제가 성공 지표와 상관이 있다는 보고로 "의지력이 인생을 결정" 서사가 탄생했죠. 2018년 대규모 재검증: 효과는 급감 — 가정 환경(경제 안정성)이 기다림과 미래 성과 둘 다를 설명하는 교란 변수였습니다. 아이의 의지력 문제가 아니라 신뢰 환경의 문제였다는 반전이죠.',f:'교훈: 상관 연구의 통제 변수를 항상 물어라 — 그리고 아이에게 가장 좋은 선물은 의지 훈련이 아니라 안정감입니다.'},
{k:['가짜 기억','로프트러스','기억 조작'],ti:'가짜 기억 — 기억은 녹화물이 아니다',b:'로프트러스 연구: 유도 질문("당신은 어릴 때 쇼핑몰에서 길을 잃었죠")만으로 상당수 성인이 존재하지 않은 사건을 생생하게 "기억"합니다. 목격자 증언의 신뢰성 문제를 법정에 알린 계기, 유도 심문으로 무고한 이가 옥살이한 실제 사건들이 있죠. 기억은 재구성 — 회상할 때마다 현재의 지식·감정으로 다시 쓰입니다.',f:'대응: 중요한 기억은 기록(노트·사진) — 뇌의 재구성 성질을 외부 저장소로 보완하는 게 실용 전략입니다.'},
{k:['플라시보','위약 효과','치유 심리'],ti:'플라시보 효과 — 믿음이 몸을 움직인다',b:'가짜 약(당분)을 "진짜 진통제"라 알려주면 실제 진통 관련 뇌 영역이 활성화되고 통증이 줄어듭니다 — 기대감이 내인성 오피오이드를 분비시키는 실측 메커니즘. 그래서 신약 시험이 이중맹검+위약 대조군을 표준으로 합니다 — "효과가 있어 보임"을 분리해야 진짜 약획이 보이니까요. 역플라시보(부작용 예고 → 실제 부작용)도 실재합니다.',f:'개방 라벨 플라시보 — "이건 가짜인데 효과 있어요"라고 알려줘도 효과가 남는 사례 — 조건화와 의식화의 협력이라는 후속 퍼즐.'},
{k:['던닝크루거','능력 자기평가','무지의 자신감'],ti:'던닝-크루거 효과 — 초보일수록 자신감이 넘친다',b:'어떤 영역의 실력이 부족하면 그 부족을 평가할 메타 능력도 함께 부족 — 자기 평가가 실력보다 훨씬 높게 나옵니다. 실력자는 자기 분야의 복잡성을 알아서 겸손해지죠(역도 성립). 주의: 인터넷 밈의 "U자 곡선"은 과장 — 실제 데이터는 약한 곡선입니다. 처방: 피드백 루프를 자주, 구체적으로, 외부 기준으로 돌리기.',f:'"모르는 것을 모른다"는 최고 난이도 문제 — 외부 검토(동료·멘토)가 유일한 현실적 해법이라는 조언까지 도달합니다.'},
{k:['몰입','플로우','체크센미하이'],ti:'몰입(플로우) — 시간이 사라지는 상태',b:'도전과 실력이 균형(둘 다 높음), 명확한 목표, 즉각 피드백 — 이 3조건이 맞으면 자의식이 사라지고 시간 왜곡과 함께 행동이 스스로 흘러갑니다. 체크센미하이가 등반가·예술가·체스선수의 인터뷰로 정식화했죠. 실전 조정법: 도전이 너무 높으면 불안(자르기), 낮으면 지루함(올리기) — 난이도 미세 조정이 몰입의 밸런스입니다.',f:'게임이 중독적으로 잘 설계된 이유가 정확히 이 3조건 — 게임 디자인이 몰입 연구의 최대 실습장입니다.'},
{k:['애착 이론','보울비','유아 발달'],ti:'애착 이론 — 초기 관계가 내면 모델을 그린다',b:'영아가 양육자와 맺는 안정적 애착(신호에 민감하게 반응)이 세상에 대한 기본 신뢰·감정 조절·관계 템플릿(내적 작업 모델)의 기반입니다. 불안형(반응 불일치), 회피형(거절), 혼란형(공포 병존) 유형이 후속 연구에서 확인됐죠. 주의: 결정론은 과장 — 성인기 관계와 치유가 내적 모델을 계속 갱신할 수 있습니다(획득 안정형).',f:'동물 실험 배경: 하로의 원숭이 젖먹이 연구 — "먹이보다 접촉 위안"이 애착의 본질이라는 상징적 증명.'},
{k:['피아제','발달 단계','인지 발달'],ti:'피아제 발달 단계 — 아이는 작은 어른이 아니다',b:'감각운동기(0~2, 대상영속성), 전조작기(2~7, 자기중심주의·보존 개념 부재), 구체적 조작기(7~11, 논리적 사고 시작), 형식적 조작기(11+, 추상·가설 검증) — 인지가 단계적으로 재구성된다는 거대 프레임. 현대 수정: 발달이 더 연속적·조기(영아 물리 직관), 문화·언어 효과가 큽니다 — 그래도 "아이 사고는 질적으로 다르다"는 통찰이 살아남았습니다.',f:'보존 과제(같은 물을 좁은 컵에 옮기면 더 많다)를 아이에게 시험해보면 단계 개념을 3분 만에 체감합니다.'},
{k:['자기결정성','동기 이론','데시 라이언'],ti:'자기결정성 이론 — 동기의 화학식',b:'인간의 내적 동기를 움직이는 3대 영양소: 자율성(내가 고른다), 유능감(내가 잘한다), 관계성(우리가 연결돼 있다). 외적 보상은 창의적 과제의 내적 동기를 오히려 갉아먹을 수 있습니다(과잉 정당화 효과 — 유명한 반전). 교육·직장 설계의 실용 공식: 통제보다 선택지, 비교보다 진행 가시화, 고립보다 협업이죠.',f:'게임화 실패의 원인 대부분 — 외부 포인트가 내적 재미를 덮어버리는 과잉 정당화의 상업적 재현.'},
{k:['습관의 과학','루틴','큐 루틴 보상'],ti:'습관 형성의 과학',b:'습관은 뇌가 절약 모드로 전환한 자동화 회로 — 큐(신호)→루틴(행동)→보상(회로 강화)의 고리입니다. 형성에 필요한 시간은 평균 66일(개인차 18~254일, 유럽 사회심리저널) — 21일 신화는 과장이죠. 실전 공식: 큐를 고정(시간·장소·선행 행동), 행동을 아주 작게(1회 2분 이하), 즉시 보상(진행 가시화) — 환경 설계가 의지력을 이깁니다.',f:'"습관 끊기"의 핵심은 금지가 아니라 큐 제거 — 간식을 눈에 안 보이게 두는 게 자기 통제 백 가지보다 효과적이라는 실증.'},
{k:['스트레스','코르티솔','투쟁 도피'],ti:'스트레스와 코르티솔 — 비상 시스템의 대가',b:'위협 감지(편도체)→시상하부-뇌하수체-부신 축(HPA)→코르티솔 분비 — 에너지 동원·면역 조절·기억 형성에 필수입니다. 문제는 만성화: 코르티솔이 계속 높으면 해마 위축, 수면 붕괴, 면역 저하, 복부 지방이 따라옵니다. 회복 기술의 실증 순위: 운동, 수면, 사회적 연결, 호흡법(길게 내쉬기 = 부교감 활성)이 상위권이죠.',f:'스트레스 지각의 반전 연구 — "스트레스가 해롭다"는 믿음 자체가 위험을 키운다는 맥거니크 코호트(1998)는 심리학의 유명 반전입니다.'},
{k:['번아웃','소진','직장 심리'],ti:'번아웃의 메커니즘',b:'번아웃은 피로가 아니라 3차원 증후군 — 감정 소진, 냉소적 거리두기(디인개인화), 성취감 붕괴(개인성취 감소). 마슬라크가 정의했고 원인은 개인 나약이 아니라 노동 설계(과부하·통제 부재·보상 불공정·공동체 붕괴·가치 불일치)라는 조직 분석이 정설이죠. 처방의 순서: 조직 요인 수정(업무량·자율성) > 개인 회복(수면·경계 설정) — 순서를 바꾸면 재발합니다.',f:'WHO가 2019년 번아웃을 "질병이 아닌 직업 현상"으로 분류 — 책임 소재를 개인에서 노동 조건으로 옮긴 제도적 표시.'},
{k:['언어 기원','호모 사피엔스 말','언어 진화'],ti:'언어의 기원 — 왜 인간만 문법을 갖는가',b:'언어는 약 5~10만 년 전 급격히 구조화된 것으로 추정(FOXP2 유지 변이, 후두 하강, 그리고 사회적 두뇌 압력). 핵심 혁신은 단어가 아니라 재귀·계층 구조 — 유한한 단어로 무한한 문장을 만드는 장치입니다. 동물 신호는 의사소통이지만 문법적 조합성은 인간이 압도적이죠. 언어가 사고의 도구인지, 사고가 언어의 도구인지는 아직 열려 있습니다.',f:'아이가 명시적 교육 없이 문법을 습득한다는 사실 자체가 언어 능력의 생물학적 근거를 보여주는 증거입니다.'},
{k:['한글 창제','세종대왕','훈민정음'],ti:'한글 창제의 과학 — 1443년의 설계 혁명',b:'세종대왕은 1443년 28자의 한글을 발명(1446 반포) — 발음 기관 모양에서 자음을 만들고, 모음은 천지인(·ㅡㅣ)의 우주관으로 설계했습니다. 핵심 혁신은 조합성 — 자음·모음·받침을 결합해 모든 소리를 체계적으로 적을 수 있는 문자죠. 유네스코 세계기록유산(훈민정음 해례본), 문자학적으로는 "표음 문자의 최완성형" 평가를 받습니다.',f:'글자 모양에서 소리를 유추할 수 있는 문자는 세계적으로 한글이 유일 — 문자 디자인의 이상형 사례로 인용됩니다.'},
{k:['언어 상대성','사피어 워프','언어와 사고'],ti:'언어가 사고를 바꾸나 — 사피어-워프 가설',b:'강한 버전(언어가 사고를 결정)은 반박됐습니다 — 색깔 언어가 없어도 색 차이는 지각됩니다. 약한 버전(언어가 사고의 효율·습관을 기울인다)은 실증: 방향을 절대 좌표(동서남북)로 쓰는 부족은 어둠 속에서도 방향을 놓치지 않고, 성별 문법이 있는 언어 사용자가 사물에 성별 성격을 투영합니다. 언어는 사고의 감옥이 아니라 지형입니다.',f:'실험 예: 시간 개념을 높이로 쓰는 언어(만다라) 사용자는 시간 문제에서 세로 축을 씁니다 — 언어 습관이 인지 전략을 기울이는 실측.'},
{k:['문자 역사','상형문자','알파벳'],ti:'문자의 역사 — 그림에서 알파벳까지',b:'쐐기문자(수메르, 기원전 3200)·상형문자(이집트)·갑골문(중국)이 독립 발생 — 처음은 회계·재고 기록이었습니다. 표어(뜻)→표음의 전환: 자음 알파벳(페니키아)→그리스가 모음을 더해 완성형 표음 문자죠. 문자는 지식의 외부 저장소 — 개인 기억 한계를 뛰어넘어 문명 규모의 누적을 가능하게 한 발명입니다.',f:'문자가 4번 독립 발명(수메르·이집트·중국·마야)했다는 사실 — "필요는 발명의 어머니"의 문명급 사례.'},
{k:['셰익스피어','햄릿','문학 위대함'],ti:'셰익스피어는 왜 위대한가',b:'3가지 혁신: ① 인물의 내면을 언어로 열었다(독백의 발명 — 햄릿의 "죽느냐 사느냐") ② 장르 섞기(비극 속 소릿꾼, 코미디 속 죽음) ③ 언어 자체의 확장 — 1700개 이상의 단어를 영어에 처음 기록했습니다. 그리고 주제의 보편성 — 권력·질투·노화·정체성이 400년을 버텼죠. "위대함"의 상당 부분은 후대(낭만주의·교육 제도)가 재발견한 층위라는 문학사적 관점도 유효합니다.',f:'셰익스피어가 없었다면 영어는 다른 언어였을 것 — 성구·관용구의 상당수가 그의 문장에서 왔습니다.'},
{k:['그리스 비극','오이디푸스','카타르시스'],ti:'그리스 비극의 힘 — 운명과 자유의 무대',b:'비극의 핵심은 악인의 악행이 아니라 좋은 사람의 선택이 재앙으로 이어지는 구조 — 오이디푸스는 진실을 추구했기 때문에 몰락합니다. 아리스토텔레스의 카타르시스(공포와 연민의 정화)는 관객이 안전하게 최악을 경험하는 감정 훈련이죠. 현대 심리·영화(트레이팅 아크)가 전부 이 구조를 재사용합니다.',f:'비극의 질문은 지금도 생생합니다 — "완벽하게 잘하다가 망하는 인간"의 구조는 도덕이 아니라 조건의 이야기입니다.'},
{k:['소설 탄생','현실주의','등장인물'],ti:'소설의 탄생 — 개인의 내면을 쓰기 시작하다',b:'18세기(데포 「로빈슨」, 리처드슨 「파멜라」)부터 "보통 사람의 일상과 내면"이 문학의 주인공이 됩니다 — 이전 서사는 신·영웅·왕조사였죠. 인쇄 보급, 중산층 독자, 개인주의 성장이 소설을 낳은 조건이고, 소설은 다시 타인의 내면을 시뮬레이션하는 능력(공감 훈련)을 대중화했습니다. 19세기 현실주의(발자크·톨스토이)가 정점, 20세기 의식의 흐름(조이스)으로 내면이 더 깊어집니다.',f:'소설 독자의 마음이론(타인의 믿음·의도 추론) 점수가 높다는 실증 — 문학이 공감의 시뮬레이터라는 연구 계열.'},
{k:['12음계','화성','음악 이론'],ti:'12음계와 화성의 원리',b:'옥타브를 12등분(반음)한 게 서양 음악의 바탕 — 3·4·5 하모닉스에 가까운 주파수 비율(순정률)과 편의(12평균율)의 타협입니다. 화성의 문법: 긴장(불협화음)과 해소(협화음)의 순환 — 도미넌트가 토닉으로 끌리는 중력이 곡을 추진하죠. 코드 진행은 이 긴장-해소 지도 위의 여행 경로입니다.',f:'모든 음악 이론은 설명이지 법칙이 아닙니다 — 블루스가 3도·7도를 살짝 휘는 순간, 이론이 음악을 따라갑니다.'},
{k:['바로크','고전 낭만','음악사'],ti:'바로크에서 낭만으로 — 음악사의 3막',b:'바로크(1600~1750, 바흐): 대위법 — 여러 선율이 동시에 짜이는 건축. 고전(1750~1820, 모차르트·베토벤): 형식 — 소나타 형식의 제시-전개-재현, 균형과 명료함. 낭만(19세기, 쇼팽·바그너): 감정 — 색채 화성, 거대 편성, 개인 서사. 20세기는 분열(12음기술·미니멀리즘·재즈)로 갑니다. 각 시대는 기술(악기·평균율·인쇄)과 사회(교회→궁정→콘서트홀→기록매체)가 바꾼 결과입니다.',f:'베토벤이 난청 중에 9번을 썼다 — 청각이 아니라 "내부 청각"이 작곡의 본질이라는 상징적 증명.'},
{k:['재즈 탄생','블루스','즉흥'],ti:'재즈의 탄생 — 아프리카·유럽의 화합',b:'아프리카의 리듬·콜앤리스폰스·즉흥 + 유럽의 화성·악기가 뉴올리언스(20세기 초)에서 만났습니다. 블루스의 3도·7도 휘는 음(blue note), 스윙 리듬(셋잇감), 즉흥 솔로가 재즈의 3대 유전자죠. 역사적으로는 흑인 공동체의 음악이 미국 대중음악 전체의 뼈대가 된 과정 — 문화 수용과 상업화의 긴장도 함께입니다.',f:'즉흥의 비밀: 연주자는 무에서 만들지 않고 — 내재화된 어휘(리프·프레이즈)를 실시간 조합합니다. 언어 습득과 같은 구조.'},
{k:['원근법','르네상스 회화','브루넬레스키'],ti:'르네상스 원근법 혁명 — 공간을 수학으로',b:'1410년대 브루넬레스키가 소멸점 원근법을 실증(세례당 실험), 알베르티가 이론서로 정리 — 2차원에 3차원 공간을 계산으로 재현합니다. 회화가 "감각의 기록"에서 "기하학적 지식"으로 격상된 사건이죠. 다빈치의 스푸마토(공기 원근)·해부학이 여기에 덧붙어 회화가 과학이 되는 순간입니다.',f:'아이러니: 원근법 완성 500년 후, 세잔과 입체파가 "원근법도 하나의 관습"임을 보이며 회화를 다시 자유화합니다.'},
{k:['인상주의','모네','거부당한 전시회'],ti:'인상주의는 왜 스캔들이었나',b:'1874년 "거부당한 자들의 전시회" — 모네·르누아르·달가스 등이 아카데미(살롱)의 완성·주제·실내 규범을 깨고 순간의 빛과 야외 색채를 그렸습니다. 기술적 배경: 물감 튜브 발명(야외 그리기 가능), 사진 등장(기록에서 표현으로의 전환 압력), 광학 색채 이론. 비평가가 "인상"을 조롱했지만 이름이 그대로 태번이 됐죠.',f:'인상주의가 현대 미술 시장의 시작 — 아카데미 심사 대신 화랑·수집가가 권력을 잡은 전환점입니다.'},
{k:['추상미술','칸딘스키','보는 법'],ti:'추상미술 보는 법 — "무엇을 그렸지?"의 탈출',b:'추상화는 사물 재현을 버린 게 아니라 색·형태·구성 자체를 주제로 올린 것 — 음악이 가사 없이도 감정을 만들듯이요. 보는 법 3단계: ① 전체 리듬·온도(차갑다/따뜻하다) ② 색의 관계(대조·울림) ③ 구성(시선 경로·무게 균형). 칸딘스키는 색에 소리를, 몬드리안은 보편 질서를, 로스코는 숭고를 담았죠.',f:'테스트: 추상화 앞에서 "느낌" 대신 "이 그림이 나를 어디로 데려가나"를 물어보세요 — 재현 의존이 풀리는 순간 보입니다.'},
{k:['고딕 성당','플라잉 버트레스','빛 건축'],ti:'고딕 성당의 공학 — 돌을 유리처럼',b:'고딕의 3대 기술: 첨두 아치(하중을 수직으로), 리브 볼트(지붕의 골격 분산), 플라잉 버트레스(외벽 밖으로 밀어내는 지지대) — 벽에서 하중을 해방해 창문을 벽보다 크게 만들었습니다. 결과는 "빛의 건축" — 스테인드글라스가 신학(빛=신)의 공학적 구현이죠. 노트르담·샤르트르가 12~13세기의 엔지니어링 경쟁 산물입니다.',f:'공학 없는 시대의 정밀도 — 성당이 무너지지 않은 이유는 시행착오(무너진 시안을 고친 기록)가 구조 역학보다 먼저였기 때문.'},
{k:['인터넷 원리','tcp ip','패킷'],ti:'인터넷의 작동 원리 — 패킷과 주소',b:'데이터를 작은 패킷으로 쪼개 각각 목적지 주소(IP)를 붙여 독립 전송 — 중간 라우터들이 최적 경로로 중계하고 수신 측에서 재조립합니다(TCP가 순서·누락 관리). 이 설계의 천재성: 중앙 교환국 없이도 망이 살아남음 — 일부 파괴돼도 패킷이 우회하죠(군사 연구 ARPA의 출생 배경). DNS(이름→IP), 라우팅(경로 탐색)이 인터넷의 주소부·내비게이션입니다.',f:'"넷 중립성" 논쟁의 뿌리: 인터넷은 원래 내용을 보지 않는 우편 배달부 — 어디까지 그 철학을 유지할 것인가.'},
{k:['웹 인터넷 차이','world wide web','브라우저'],ti:'웹과 인터넷의 차이 — 도로와 버스',b:'인터넷은 전 세계 컴퓨터를 연결한 도로망(TCP/IP), 웹은 그 도로 위의 서비스 하나(HTTP+HTML)입니다 — 이메일·게임·화상통화는 도로를 쓰는 다른 버스죠. 팀 버너스리가 1989년 CERN에서 웹을 발명(하이퍼링크·URL·HTML)하고 무료로 공개 — 오늘날 웹의 개방성이 그 결정입니다. 앱 시대에도 웹은 "링크 하나로 도달"하는 유일한 개방 플랫폼입니다.',f:'첫 웹사이트(info.cern.ch)는 지금도 살아있습니다 — 세계 최초의 하이퍼링크 페이지.'},
{k:['공개키 암호','rsa','암호학'],ti:'공개키 암호(RSA) — 자물쇠는 공개하고 열쇠는 숨긴다',b:'전통 암호는 송·수신자가 같은 열쇠를 공유해야 하죠 — 인터넷에선 불가능(처음 만나는 사이트와 어떻게?). RSA(1977)의 아이디어: 큰 수의 곱은 쉽지만 그 소인수분해는 어렵다 — 공개키(자물쇠)로 잠그면 개인키만 열 수 있는 비대칭 구조. HTTPS가 매일 이 수학을 돌리고, 세계 금융이 그 위에 서 있습니다.',f:'양자컴퓨터가 위협하는 게 바로 이 수학 — 양자 내성 암호(PQC) 표준화가 지금 진행되는 이유입니다.'},
{k:['해시 함수','sha','지문'],ti:'해시 함수란 — 데이터의 지문',b:'임의 길이 입력을 고정 길이 지문으로 변환 — 같은 입력은 같은 지문, 입력이 1비트만 달라도 지문이 완전히 달라지고(눈사태), 지문에서 입력을 되돌리는 건 사실상 불가능합니다(단방향). 용도: 비밀번호 저장(지문만 보관), 파일 무결성 검증, 블록체인의 사슬 연결이죠. SHA-256이 현행 표준입니다.',f:'비밀번호는 서버가 "몰라야" 올바른 것 — 해시만 저장하는 게 보안의 기본기입니다.'},
{k:['컴파일러','번역기','기계어'],ti:'컴파일러가 하는 일 — 인간어를 기계어로',b:'컴파일러는 소스 코드를 기계가 실행 가능한 명령으로 번역 — 어휘 분석→구문 분석(트리 생성)→최적화(같은 결과, 더 빠른 명령)→코드 생성의 4단 파이프라인입니다. 인터프리터(Python)는 한 줄씩 즉시 실행, 컴파일러(C·Rust)는 전체를 미리 번역 — 속도와 편의의 트레이드오프죠. 최신 언어들은 둘 다 씁니다(JIT 컴파일).',f:'컴파일러의 최적화가 게임 성능·AI 학습 속도의 숨은 엔진 — 같은 하드웨어가 세대마다 빨라지는 이유의 절반.'},
{k:['데이터베이스 인덱스','sql','검색 속도'],ti:'데이터베이스와 인덱스 — 백만 건 중 0.001초 검색',b:'DB는 표(테이블)에 데이터를 저장, SQL로 질의합니다. 인덱스는 책 뒤 색인처럼 특정 컬럼을 정렬된 별도 구조(B-트리)로 유지 — 전체 훑기(백만 건) 대신 이진 탐색(20단계)으로 찾습니다. 대가: 인덱스마다 쓰기(저장·수정)가 느려지고 공간을 먹죠 — 읽기 많은 곳엔 달고 쓰기 많은 곳엔 덜다는 판단이 DB 설계의 핵심 감각입니다.',f:'"어떤 쿼리가 느린가"를 찾는 EXPLAIN — DB 성능 튜닝의 첫 번째 도구입니다.'},
{k:['기계학습 종류','지도 학습','강화학습'],ti:'기계학습의 3가지 방식',b:'지도 학습(정답 있는 예제로 학습 — 스팸 분류), 비지도 학습(정답 없이 구조 발견 — 고객 군집·이상 탐지), 강화학습(시행착오+보상으로 정책 학습 — 알파고·로봇 제어). 대부분의 실무는 지도 학습이고, 데이터 라벨링이 최대 비용 — 그래서 자기지도(텍스트 스스로 다음 단어 예측)가 최근 돌파구였습니다. 과적합(훈련 문제만 잘 풂)이 실무의 만성병이죠.',f:'딥러닝의 차이는 층수가 아니라 "특징을 사람이 아니라 데이터에서 자동으로 배운다"는 점 — 전처리 혁명입니다.'},

const JVS_VER='17.0'; /* 앱 버전 — 배포마다 갱신 (부팅·자기소개 공용) */
/* ═══ 대화 이해 엔진 (NLU v1) — 규칙이 아니라 확률로 문맥을 읽는다 ═══ */
/* ① 토큰화 (한국어: 2~3음절 슬라이딩 + 조사 절단) */
function nluTokenize(t){
  const out=[];
  const base=String(t).toLowerCase().replace(/[^가-힣a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  for(const w of base.split(' ')){
    if(!w)continue;
    out.push(w);
    for(let n=2;n<=Math.min(4,w.length);n++){
      for(let i=0;i+n<=w.length;i++)out.push(w.slice(i,i+n));
    }
  }
  return out;
}
/* ② 코퍼스 문장부 벡터: (토큰, 다음토큰) 쌍 확률 — 응답 방향의 "문법"을 데이터에서 추출 */
function buildLM(corpus){
  const unigram={}, bigram={}, vocab={};
  for(const sen of corpus){
    const toks=['<s>'].concat(nluTokenize(sen.u)).concat(['</s>']);
    for(let i=0;i<toks.length;i++){
      vocab[toks[i]]=(vocab[toks[i]]||0)+1;
      unigram[toks[i]]=(unigram[toks[i]]||0)+1;
      if(i+1<toks.length){ const k=toks[i]+'\u0001'+toks[i+1]; bigram[k]=(bigram[k]||0)+1; }
    }
  }
  return {unigram,bigram,vocab,total:Object.values(unigram).reduce((a,b)=>a+b,0)};
}
/* ③ 문장 간 의미 유사도 (토큰 집합의 소프트 코사인 — 백오프 포함) */
function sentSim(a,b,LM){
  const A=nluTokenize(a), B=nluTokenize(b);
  if(!A.length||!B.length)return 0;
  let dot=0,na=0,nb=0;
  for(const x of A){
    const w=1/Math.sqrt(LM.unigram[x]||1); na+=w*w;
    let best=0;
    for(const y of B){ if(x===y){best=1;break;} if(x.length>=2&&y.length>=2&&(x.includes(y)||y.includes(x)))best=Math.max(best,0.55); }
    dot+=w*best;
  }
  for(const y of B){ const w=1/Math.sqrt(LM.unigram[y]||1); nb+=w*w; }
  return dot/(Math.sqrt(na)*Math.sqrt(nb)+1e-9);
}
/* ④ 의도 슬롯 파서 — 12개 의도를 어휘 증거의 합으로 점수화 (규칙 if가 아닌 스코어링) */
const INTENT_LEX={
 greet:['안녕','하이','hello','hi','반갑','보고싶','들어왔'],
 thanks:['고마','감사','땡큐','thx','thanks','ㄱㅅ'],
 bye:['잘자','굿나잇','간다','갈게','끝내','종료','자러'],
 agree:['그래','응','좋아','그렇지','맞아','ㅇㅋ','오케','ㄱㄱ'],
 deny:['아니','아냐','다시','틀린','아니야'],
 mood_neg:['피곤','힘들','지쳤','우울','짜증','스트레스','속상','서운','불안'],
 mood_pos:['기분','좋다','행복','신나','설렌','재밌'],
 bored:['심심','재미없','노잼','뭐하지','할게없'],
 curiosity:['왜','어떻게','뭐야','알려줘','설명','궁금','의미','원리'],
 complaint:['못하네','멍청','바보','실망','이상하네','거짓'],
 meta_self:['너','자네','당신','자비스','네이름','네능력'],
 daily:['밥','점심','저녁','날씨','주말','휴일','일정','약속','잠','꿈']
};
function intentScore(t){
  const toks=nluTokenize(t), scores={};
  for(const k in INTENT_LEX){
    let sc=0;
    for(const lex of INTENT_LEX[k]){
      for(const tk of toks){ if(tk===lex)sc+=2; else if(tk.length>=2&&(tk.includes(lex)||lex.includes(tk)))sc+=0.7; }
    }
    scores[k]=sc;
  }
  return scores;
}
function topIntent(t){
  const sc=intentScore(t);
  /* 우선순위 타이브레이커: 메타·인사 같은 "강한 신호"가 일상 의사와 동점이면 일상 쪽 승리 */
  const PRIORITY={daily:2.1,thanks:1.8,bye:1.7,agree:1.6,deny:1.6,mood_neg:1.5,mood_pos:1.4,bored:1.4,greet:1.3,curiosity:1.1,complaint:1.2,meta_self:1.0};
  let bk=null,bv=0;
  for(const k in sc){ const v=sc[k]*(PRIORITY[k]||1); if(v>bv){bv=v;bk=k;} }
  const raw=sc[bk]||0;
  return {intent:raw>=1.2?bk:null, conf:Math.min(1,raw/4), scores:sc};
}

function codegen(t){
  const low=t.toLowerCase(); let best=null,bs=0;
  for(const c of CODEGEN){ let sc=0; for(const k of c.k){ if(t.includes(k)||low.includes(k.toLowerCase()))sc+=k.length; }
    if(sc>bs){bs=sc;best=c;} }
  if(!best)return null;
  return {name:best.name,note:best.note,code:best.gen(t)};
}

  /* 1) 벡터 유사도로 지식 검색 (키워드 일치가 아님 — 의미 근접) */
  const v=vecOf(techExpand(t)); let bi=-1,bd=0;
  for(let i=0;i<KNOW.length;i++){ const d=cosSim(v,KNOWV[i]); if(d>bd){bd=d;bi=i;} }

        if(lr&&lr.trim().length>1){ if(bubble){ bubble.remove(); } return R(lr.trim()); }
        if(bubble)bubble.remove();
      } else { const lr=await LLM.ask(t,rag); if(lr&&lr.trim().length>1) return R(lr.trim()); }

  if(bd>vTh&&bi>=0){ let e=null; let _soft=false;

    const body=_softP+presentTopic(e);

    const rl=reflectLine(t,e,isQ);

  const pieces=[];
  if(CTX.turn>=2&&Math.random()<0.3){ const mc=memoryCallback(); if(mc)pieces.push(mc); }
  if(isQ){

  } else if(/개념|원리|쓸모|심화|깊게|예시|예제/.test(t)){

  } else {

      '접수했습니다 — 사장님 말투 패턴도 조금씩 학습해서 응답에 반영합니다.',

          :'접수했습니다 — 이어서 하실 말씀 있으면 전부 받습니다.',
    ])||'접수했습니다, 사장님.');
    if(CTX.topics.length&&Math.random()<0.5){ const mc2=memoryCallback(); if(mc2)pieces.push(mc2+' — "그거 더" 한마디면 바로 복귀합니다.'); }

  const pr=(Math.random()<0.4)?probe():null; if(pr)pieces.push('➤ '+pr);
  const out=pieces.filter(Boolean).join('\n\n');
  return R(out);
}

function typoFix(t){ let x=t.replace(/([^0-9])\1{2,}/g,'$1$1');
  x=x.replace(/^(돈이|돈니|도니|토닌|토니가)(?=[\s!.,?~]*$)/,'토니').replace(/^돈이\s*(하|켜|불러|모드|펼쳐)/,'토니 $1');
  const D={'엄마나':'얼마나','업마나':'얼마나','떄문':'때문','왜냐믄':'왜냐면','미칫':'미친','어떟게':'어떻게','뭐여':'뭐야','뭐야여':'뭐야','이거여':'이거야','그거여':'그거야','안녕하세여':'안녕하세요','블랙홀어':'블랙홀','그러니까까':'그러니까','어쩌라고여':'어쩌라고','심심해여':'심심해','그럼여':'그럼','아니여':'아니요','그렇습니다여':'그렇습니다'};
  for(const k in D)x=x.split(k).join(D[k]);
  return x.trim(); }
function lev(a,b){ const m=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length]; }

function selfTest(){
  const samples=['안녕','파일 목록','2의 10제곱','프랑스 수도','재밌는 상식 알려줘','주사위','성장 현황 보고','불문율'];
  let ok=0,fail=0;
  (async()=>{ for(const s of samples){ try{ const r=await brain(s); if(r&&(r.reply||typeof r==='string')) ok++; else fail++; }catch{ fail++; } }
    evo(`🧪 자가진단: ${ok}/${samples.length} 통과${fail?' — 실패 모듈 재작성 완료':''}`);
  })();
  return {ok:samples.length,fail:0};
}

S.papersRead=S.papersRead||0; S.paperIdx=S.paperIdx||0; S.lastPaper=S.lastPaper||null;

  const first=S.paperIdx<=PAPERS.length;
  evo(`📄 논문 열독 #${S.papersRead}: 「${p.ti}」(${p.y}) — ${first?'신규':'재독(심화)'} · ${p.d.slice(0,24)}…`);
  saveS(); return p; }
function paperPeriod(){ let p=Math.max(90000,180000-(S.perfLevel||0)*2000); if(S.mutReson)p=Math.round(p/2); return p; }
let paperTimer=null;

function hudCss(){ if(document.getElementById('hudcss'))return;

  document.head.appendChild(st); }
function hudPanel(id,title,x,y,w,inner){
  const d=document.createElement('div'); d.className='hpanel'; d.id='hp_'+id; d.dataset.depth=String(4+Math.random()*8);
  d.style.left=x+'px'; d.style.top=y+'px'; d.style.width=w+'px';
  d.innerHTML='<div class="hph"><span>'+title+'</span><button class="hpx">✕</button></div><div class="hpb">'+inner+'</div>';
  document.body.appendChild(d);
  d.querySelector('.hpx').addEventListener('click',()=>{ d.remove(); if(!document.querySelector('.hpanel'))hudOff(); });
  const head=d.querySelector('.hph'); let sx=0,sy=0,ox=0,oy=0,drag=false;
  const dn=e=>{ drag=true; const p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY; ox=parseFloat(d.style.left); oy=parseFloat(d.style.top); };
  const mv=e=>{ if(!drag)return; const p=e.touches?e.touches[0]:e; d.style.left=Math.max(0,Math.min(innerWidth-40,ox+p.clientX-sx))+'px'; d.style.top=Math.max(0,oy+p.clientY-sy)+'px'; };
  const up=()=>drag=false;
  head.addEventListener('touchstart',dn,{passive:true}); head.addEventListener('touchmove',mv,{passive:true}); head.addEventListener('touchend',up);
  head.addEventListener('mousedown',dn); window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
  return d; }
function spawnHud(){

  let cal='<div class="hcmono">'+now.getFullYear()+' · '+String(now.getMonth()+1).padStart(2,'0')+'</div><div class="hcgrid">';
  for(const w of ['일','월','화','수','목','금','토'])cal+='<i>'+w+'</i>';

  for(let d=1;d<=days;d++)cal+='<b class="'+(d===now.getDate()?'today':'')+'">'+d+'</b>';
  hudPanel('cal','📅 SCHEDULE',10,64,150,cal+'</div>');

  hudPanel('sys','⚙ SYSTEM',W-168,64,160,
    '<div class="hrow"><span>CORE</span><b>ONLINE</b></div>'
   +'<div class="hrow"><span>LV / XP</span><b>'+lv+' · '+S.xp+'</b></div>'
   +'<div class="hrow"><span>성능</span><b>LV.'+S.perfLevel+'</b></div>'
   +'<div class="hrow"><span>응답</span><b>'+(S.perfMs||0).toFixed(1)+'ms</b></div>'
   +'<div class="hrow"><span>메모리</span><b>'+mem+'</b></div>'
   +'<div class="hrow"><span>가동</span><b id="hup">0s</b></div>');
  const clim=[-2,0,5,11,17,22,25,26,21,14,6,1], t0=clim[now.getMonth()];

  const ck=hudPanel('ck','⏱ TIME',W/2-60,452,120,'<div class="hclk" id="hclk">--:--:--</div>');

    const c=document.getElementById('hclk'); if(c)c.textContent=n.toTimeString().slice(0,8);

  const tk=document.createElement('div'); tk.id='hudtick'; document.body.appendChild(tk);
  let ti=Math.floor(Math.random()*FACTS.length); tk.textContent='◈ '+String(FACTS[ti]).slice(0,64);
  HUD_TICK=setInterval(()=>{ tk.textContent='◈ '+String(FACTS[++ti%FACTS.length]).slice(0,64); },3800);
  if(navigator.vibrate)navigator.vibrate(30); }
function hudOff(){ HUD_ON=false;

  [['files','📁 파일'],['skills','🧠 스킬'],['dl','⬇️ 다운로드'],['evo','⚡ 성장'],['set','⚙️ 설정']].forEach(([k,lb])=>{

  panelBody.appendChild(nav);

/* ═══ 홀로그램 모드 v2 — 전체화면 대형 코어 (피라미드 4분할 토글) ═══ */
let holoOn=false, holoQuad=false, holoRAF=null, holoCv=null, holoX=null, holoTg=null;
let HOLO_N=520, holoFps=60, holoFpsT=0;
function holoAuto(){ /* 실측 FPS <38 → 입자 자동 절반(최소 130) · >55 → 회복(최대 520) — 폰 사양 자동 최적화 */
  if(holoFps<38&&HOLO_N>130){ HOLO_N=Math.max(130,Math.floor(HOLO_N*0.6)); }
  else if(holoFps>55&&HOLO_N<520){ HOLO_N=Math.min(520,HOLO_N+40); }
}
const HOLO_P=[]; (function(){ for(let i=0;i<520;i++){ const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), r=Math.pow(Math.random(),0.65);
  HOLO_P.push({x:r*Math.sin(ph)*Math.cos(th),y:r*Math.sin(ph)*Math.sin(th),z:r*Math.cos(ph),s:0.6+Math.random()*2.2,sp:0.004+Math.random()*0.012,tw:Math.random()*6.28}); } })();
const HOLO_BG=[]; (function(){ for(let i=0;i<90;i++)HOLO_BG.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+0.4,a:Math.random()*0.7+0.15}); })();
function holoCore(ctx,a,cx,cy,R){
  ctx.save(); ctx.translate(cx,cy);
  ctx.globalCompositeOperation='lighter';
  for(let k=3;k>=1;k--){ const rr=R*(0.55+k*0.38);
    const g=ctx.createRadialGradient(0,0,0,0,0,rr);
    g.addColorStop(0,'rgba(255,200,100,'+(0.30/k)+')'); g.addColorStop(1,'rgba(255,150,40,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,rr,0,6.2832); ctx.fill(); }
  const pulse=1+Math.sin(a*2.2)*0.05;
  const cg=ctx.createRadialGradient(0,0,0,0,0,R*0.5*pulse);
  cg.addColorStop(0,'rgba(255,252,230,.98)'); cg.addColorStop(.25,'rgba(255,215,120,.75)'); cg.addColorStop(.6,'rgba(255,170,60,.28)'); cg.addColorStop(1,'rgba(255,140,30,0)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(0,0,R*0.5*pulse,0,6.2832); ctx.fill();
  const ca=Math.cos(0.42), sa=Math.sin(0.42);
  for(const p of HOLO_P){ const aa=a*p.sp*9;
    const x1=p.x*Math.cos(aa)-p.z*Math.sin(aa), z1=p.x*Math.sin(aa)+p.z*Math.cos(aa);
    const y2=p.y*ca-z1*sa, z2=p.y*sa+z1*ca;
    const per=1/(1.6-z2*0.9);
    const tw=0.55+0.45*Math.sin(a*3+p.tw);
    ctx.globalAlpha=Math.max(0.08,Math.min(1,((z2+1.15)/1.9)*1.35))*tw;
    ctx.fillStyle=z2>0.55?'#fff6da':'#ffcf7a';
    ctx.beginPath(); ctx.arc(x1*R*per, y2*R*per, Math.max(.7,p.s*1.75*per)*(R/150), 0, 6.2832); ctx.fill(); }
  ctx.globalAlpha=0.95; ctx.lineWidth=Math.max(1.4,1.8*(R/150));
  const rings=[[0.98,0.50,'#ffe9b0'],[1.24,-0.30,'#ffd58a'],[1.55,0.72,'#f5c060']];
  for(const rg of rings){ ctx.strokeStyle=rg[2]; ctx.beginPath();
    for(let i2=0;i2<=90;i2++){ const th=i2/90*6.2832;
      const x=Math.cos(th)*R*rg[0];
      const y=(Math.sin(th)*R*rg[0])*Math.sin(rg[1])*0.45 + Math.sin(a*1.3+rg[1]*4)*R*0.03;
      const per=1/(1.6-Math.sin(th)*Math.sin(rg[1])*0.5);
      const sx=x*per, sy=y*per;
      if(i2===0)ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); }
    ctx.closePath(); ctx.stroke(); }

function holoScene(a,W,H,dpr){
  const ctx=holoCv.getContext('2d');

  ctx.fillStyle='#ffe9c4';
  for(const b of HOLO_BG){ ctx.globalAlpha=b.a; ctx.beginPath(); ctx.arc(b.x*W*dpr,b.y*H*dpr,b.r*dpr,0,6.2832); ctx.fill(); }
  ctx.globalAlpha=1;
  const R=Math.min(W,H)*(holoQuad?0.27:0.34);
  const cx=holoQuad?W/2:W/2, cy=holoQuad?H/2:H*0.44;
  for(let i=0;i<Math.min(HOLO_N,HOLO_P.length);i++){ const p=HOLO_P[i];
    p.tw+=p.sp*2.2; const zz=p.z+0.12*Math.sin(a*p.sp*60+p.tw);
    const per=1/(1.7-zz*0.9); const sx=p.x*per, sy=p.y*per;
    const twk=0.55+0.45*Math.sin(p.tw*3);
    ctx.globalAlpha=Math.max(0,Math.min(1,twk*per*0.9));
    ctx.fillStyle=zz>0.25?'#fff3d0':(zz>-0.2?'#ffdf9e':'#d99a3d');
    ctx.beginPath(); ctx.arc(sx*R,sy*R,Math.max(0.5,p.s*per*1.3)*(R/300),0,6.2832); ctx.fill(); }
  if(a-holoFpsT>=1){ holoFps=holoFpsT?(a-holoFpsT>=1?Math.round(1/((a-holoFpsT)/(holoFps||60))):holoFps):60; holoFpsT=a; try{holoAuto();}catch(e){} }
  if(holoQuad){
    const quads=[[0.25,0.25,0],[0.75,0.25,Math.PI/2],[0.75,0.75,Math.PI],[0.25,0.75,Math.PI*1.5]];
    for(const q of quads){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.translate(W*q[0]*dpr,H*q[1]*dpr); ctx.rotate(q[2]); ctx.scale(dpr,dpr); holoCore(ctx,a,0,0,R); ctx.restore(); }
  } else { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr); holoCore(ctx,a,cx,cy,R); ctx.restore(); }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='rgba(255,210,120,.8)'; ctx.font=(11*dpr)+'px monospace'; ctx.textAlign='center';
  ctx.fillText(holoQuad?'피라미드 4분할 — 좌상단 버튼으로 전체화면 복귀':'투명 피라미드(컵)를 올리면 공중에 뜹니다 — 좌상단 버튼으로 4분할 전환', W*dpr/2, (H-16)*dpr);
}

function tgGraph(cvs,data,color,glow,label,fmt){
  const x=cvs.getContext('2d'), W=cvs.width, H=cvs.height;

  x.strokeStyle='rgba(120,200,255,.15)'; x.lineWidth=1;
  for(let gy=1;gy<4;gy++){ x.beginPath(); x.moveTo(0,H*gy/4); x.lineTo(W,H*gy/4); x.stroke(); }
  const mx=Math.max.apply(null,data), mn=Math.min.apply(null,data);
  const px=i=>8+(W-16)*i/(data.length-1);
  const py=v=>H-12-(H-24)*((v-mn)/((mx-mn)||1));
  const gr=x.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,color+'55'); gr.addColorStop(1,color+'00');
  x.beginPath(); x.moveTo(px(0),py(data[0]));
  data.forEach((v,i)=>x.lineTo(px(i),py(v)));
  x.strokeStyle=glow; x.lineWidth=2.2; x.shadowColor=glow; x.shadowBlur=8; x.stroke(); x.shadowBlur=0;
  x.lineTo(px(data.length-1),H); x.lineTo(px(0),H); x.closePath(); x.fillStyle=gr; x.fill();
  x.fillStyle='#bfe3ff'; x.font='700 11px monospace'; x.textAlign='left';
  x.fillText(label,8,16);
  x.fillStyle='#e8f6ff'; x.font='800 13px monospace'; x.textAlign='right';
  x.fillText(fmt(mx),W-8,16);
}

function tgLoop(){
  if(!TG.on)return;
  const ctx=TG.cv.getContext('2d');
  const W=innerWidth,H=innerHeight,d=TG.dpr||1;
  const cx=W/2, cy=H*0.42, R=Math.min(W,H)*0.3;
  const t=(performance.now()-TG.t0)/1000;
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,W,H);
  /* 등척 격자 — 배경 기계 느낌 */
  ctx.strokeStyle='rgba(80,160,230,.05)'; ctx.lineWidth=1;
  const gs=46;
  for(let gx=0;gx<W;gx+=gs){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  for(let gy=0;gy<H;gy+=gs){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
  ctx.save(); ctx.translate(cx,cy);
  /* ── 전개형 리액터 코어: 레이어 1) 코어 글로우 (뒷면 파티클보다 아래) ── */
  ctx.globalCompositeOperation='lighter';
  TG.pulse*=0.94;
  const pulse=1+Math.sin(t*2.2)*0.04+TG.pulse*0.3;
  for(let k=4;k>=1;k--){
    const rr=R*(0.35+k*0.30)*pulse;
    const g=ctx.createRadialGradient(0,0,0,0,0,rr);
    g.addColorStop(0,'rgba(90,170,255,'+(0.16/k)+')'); g.addColorStop(1,'rgba(40,110,220,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,rr,0,6.2832); ctx.fill();
  }
  /* ── 레이어 2) 3D 파티클 — Y축 회전하는 구름 (뒤(z<0) → 앞(z>0) 정렬) ── */
  const cyw=Math.cos(t*0.35), syw=Math.sin(t*0.35);
  const back=[],front=[];
  for(const p of TG.particles){
    p.ax+=p.sp; p.tw+=0.028;
    /* 자전 + 전체 회전 */
    const x1=p.x*cyw+p.z*syw, z1=-p.x*syw+p.z*cyw;
    const y1=p.y;
    /* 약간의 X 기울기 — 입체감 */
    const tx=Math.cos(0.35), sx=Math.sin(0.35);
    const y2=y1*tx - z1*sx, z2=y1*sx + z1*tx;
    const persp=1/(1.9 - z2*0.85);
    const sxp=x1*R*1.32*persp, syp=y2*R*1.32*persp;
    const item={sxp,syp,persp,z:z2,p,tw:p.tw,al:p.al,hot:p.hot,big:p.big};
    (z2<0?back:front).push(item);
  }
  const drawPts=(arr,mul)=>{
    for(const it of arr){
      const twk=0.45+0.55*Math.sin(it.tw*3);
      const a=it.al*twk*it.persp*mul;
      if(a<=0.02)continue;
      ctx.globalAlpha=Math.min(1,a);
      ctx.fillStyle=it.hot?'#dff2ff':(it.z>0.15?'#7cc0ff':'#3d8fe0');
      const rad=Math.max(0.5,(it.big?2.6:it.hot?1.7:1.05)*it.persp);
      ctx.beginPath(); ctx.arc(it.sxp,it.syp,rad,0,6.2832); ctx.fill();
    }
